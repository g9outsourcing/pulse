<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Attendance</title>
<meta name="description" content="Employee attendance and clock-in board for G9 Outsourcing / NYTelecon.">
<style>
:root{
  --bg:#ffffff; --bg-sunk:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f5;
  --border:#e4e7eb; --border-strong:#d2d7dd;
  --text:#14161a; --text-2:#5b6270; --text-3:#878f9c;
  --accent:#3b5bdb; --accent-soft:#eaeeff; --on-accent:#fff;
  --ok:#1a7f52; --ok-soft:#e6f4ed;
  --warn:#9a6212; --warn-soft:#fdf2e0;
  --bad:#b3261e; --bad-soft:#fdeceb;
  --info:#1f6f9c; --info-soft:#e7f2f8;
  --mute:#6b7280; --mute-soft:#f0f1f3;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(16,18,22,.05), 0 8px 24px rgba(16,18,22,.06);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --bg-sunk:#0a0b0e; --surface:#16191e; --surface-2:#1d2026;
    --border:#272b33; --border-strong:#353a44;
    --text:#eef0f3; --text-2:#a3abb8; --text-3:#767e8b;
    --accent:#748ffc; --accent-soft:#1c2338; --on-accent:#0e1013;
    --ok:#4ec08a; --ok-soft:#10261c;
    --warn:#e3b341; --warn-soft:#2a2113;
    --bad:#f28b82; --bad-soft:#2d1614;
    --info:#6fb6dd; --info-soft:#11232e;
    --mute:#9aa2ae; --mute-soft:#1d2026;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --bg-sunk:#0a0b0e; --surface:#16191e; --surface-2:#1d2026;
  --border:#272b33; --border-strong:#353a44;
  --text:#eef0f3; --text-2:#a3abb8; --text-3:#767e8b;
  --accent:#748ffc; --accent-soft:#1c2338; --on-accent:#0e1013;
  --ok:#4ec08a; --ok-soft:#10261c;
  --warn:#e3b341; --warn-soft:#2a2113;
  --bad:#f28b82; --bad-soft:#2d1614;
  --info:#6fb6dd; --info-soft:#11232e;
  --mute:#9aa2ae; --mute-soft:#1d2026;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px;
  padding:0 16px; height:60px; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  padding:7px 13px;border-radius:999px;color:var(--text-2);font-size:14px;font-weight:500;white-space:nowrap;
}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.clock{font-size:14px;color:var(--text-2);font-weight:500;white-space:nowrap}
.iconbtn{
  width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--text-2);border:1px solid var(--border);
}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--border)}
.who:hover{background:var(--surface-2)}
.avatar{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;flex:none;
}
.main{padding:22px 16px 80px;max-width:1500px;margin:0 auto}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600}
.sub{color:var(--text-2);font-size:14px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-body{padding:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);font-size:14px;font-weight:500;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-sm{padding:5px 10px;font-size:13px}
.input,select.input{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);
}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap;
}
.pill .sq{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--mute-soft);color:var(--mute)}
.p-accent{background:var(--accent-soft);color:var(--accent)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;
  background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:600;white-space:nowrap;
}

/* ---------- status strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:20px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;text-align:left;transition:border-color .12s,transform .12s;
}
.stat:hover{border-color:var(--border-strong)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat .v{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.stat .l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);font-weight:500;margin-top:3px}
.stat .l .sq{width:8px;height:8px;border-radius:2px;flex:none}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-3);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);
}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-sunk)}
.r{text-align:right}
.name{font-weight:550}
.muted{color:var(--text-2)}
.tiny{font-size:12px;color:var(--text-3)}

/* ---------- coverage ---------- */
.bar{position:relative;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;display:block}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.over{background:var(--info)}
.bal{font-weight:650}
.bal.neg{color:var(--bad)} .bal.pos{color:var(--info)} .bal.zero{color:var(--text-2)}
.rollups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.roll{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg-sunk)}
.roll .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600}
.roll .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px}

/* segment ribbon */
.ribbon{display:flex;height:7px;border-radius:999px;overflow:hidden;background:var(--surface-2);min-width:90px}
.ribbon span{display:block;height:100%}
.dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}

/* ---------- agent home ---------- */
.agentwrap{max-width:560px;margin:0 auto}
.hero{text-align:center;padding:10px 0 22px}
.hero .hi{font-size:15px;color:var(--text-2)}
.hero .now{font-size:46px;font-weight:650;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.hero .date{font-size:13.5px;color:var(--text-3);margin-top:2px}
.schedcard{padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);margin-bottom:14px}
.seg{display:flex;gap:12px;padding:11px 0;border-top:1px dashed var(--border)}
.seg:first-of-type{border-top:none;padding-top:4px}
.seg .time{font-weight:600;white-space:nowrap;font-size:14px}
.seg .camp{font-size:14px}
.bigbtn{
  width:100%;padding:20px;border-radius:var(--radius);font-size:19px;font-weight:650;letter-spacing:-.01em;
  border:1px solid transparent;transition:transform .08s,filter .12s;
}
.bigbtn:active{transform:scale(.985)}
.bigbtn.go{background:var(--ok);color:#fff}
.bigbtn.late{background:#f0a429;color:#3a2600}
.bigbtn.stop{background:var(--surface);border-color:var(--border-strong)}
.bigbtn[disabled]{opacity:.55;cursor:not-allowed}
.timer{font-size:40px;font-weight:650;letter-spacing:-.03em;text-align:center;line-height:1.1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flash{
  background:var(--ok-soft);color:var(--ok);border:1px solid transparent;border-radius:var(--radius);
  padding:13px 15px;font-weight:600;text-align:center;margin-bottom:12px;animation:pop .3s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- login ---------- */
.loginwrap{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg-sunk)}
.loginbox{width:100%;max-width:400px}
.loginbox .card-body{padding:24px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.quick{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.quick button{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--radius-sm);text-align:left;font-size:13.5px;
}
.quick button:hover{background:var(--surface-2);border-color:var(--border-strong)}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--text-3);font-size:11.5px;font-weight:600;letter-spacing:.05em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px}

/* ---------- misc ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty .big{font-size:34px;margin-bottom:8px}
.exc{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border)}
.exc:last-child{border-bottom:none}
.exc .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
@media (max-width:1050px){.grid2{grid-template-columns:1fr}}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daycard{border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;background:var(--surface)}
.daycard.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.banner{
  background:var(--accent-soft);color:var(--accent);padding:9px 14px;border-radius:var(--radius-sm);
  font-size:13px;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start;
}
footer.note{max-width:1500px;margin:0 auto;padding:0 16px 40px;color:var(--text-3);font-size:12.5px}
@media (max-width:640px){
  .main{padding:16px 12px 70px}
  h1{font-size:22px}
  .hero .now{font-size:40px}
  .clock{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===========================================================================
   PULSE — Employee Attendance & Clock-In
   Single-file static app. No build step, no server, no dependencies.
   Data is stored in this browser's localStorage.
   =========================================================================== */

/* ---------------------------------------------------------------
   1. REFERENCE DATA  (edit these lists to match your own roster)
   --------------------------------------------------------------- */

// required FTE per campaign per working day

  {id:'a9', name:'Eloisa Mendoza',       unit:'Incall',  cls:'Temp',       skill:'CS',   band:'day'},

const TL_COLOR = {
  Cha:'#3b5bdb', Jovi:'#0b7285', Maricel:'#9c36b5', Allen:'#2b8a3e',
  Kurtnie:'#c2410c', Rizza:'#a61e4d', Christine:'#5c7cfa', Tessa:'#495057'
};

// Demo sign-ins. Any email + any password works; these just pick a role quickly.
const USERS = [
  {email:'abi@nytelecon.com',    name:'Abi Esmao',  role:'agent',      agentId:'a1'},
  {email:'cha@nytelecon.com',    name:'Cha',        role:'tl'},
  {email:'jovi@nytelecon.com',   name:'Jovi',       role:'tl'},
  {email:'tessa@nytelecon.com',  name:'Tessa Jacob',role:'admin'},
];

// The agent used by the demo sign-in — always given a real shift.
const DEMO_AGENT = 'a1';

// Thresholds (minutes)
const SETTINGS = {grace:5, mia:30, absent:120, earlyIn:60};

/* ---------------------------------------------------------------
   2. SMALL HELPERS
   --------------------------------------------------------------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,p={},...kids)=>{
  const n=document.createElement(t);
  for(const [k,v] of Object.entries(p)){
    if(k==='class') n.className=v;
    else if(k==='html') n.innerHTML=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v!==null&&v!==undefined&&v!==false) n.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{ if(k===null||k===undefined||k===false)return;
    n.appendChild(typeof k==='object'?k:document.createTextNode(String(k))); });
  return n;
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const isWeekend = d => d.getDay()===0 || d.getDay()===6;

// minutes-from-midnight -> "8:30 AM"  (handles values > 1440)
function hhmm(min){
  const m=((min%1440)+1440)%1440, h=Math.floor(m/60), mm=m%60;
  const ap=h<12?'AM':'PM'; const h12=h%12===0?12:h%12;
  return h12+':'+pad(mm)+' '+ap;
}
const fmtDur = mins => (mins<0?'-':'')+Math.floor(Math.abs(mins)/60)+'h '+pad(Math.abs(mins)%60)+'m';
const fteTxt = n => (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');

// deterministic 0..1 from a string — keeps the demo stable across reloads
function rnd(seed){
  let h=2166136261;
  for(let i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%100000)/100000;
}
const initials = n => n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const campaign = id => CAMPAIGNS.find(c=>c.id===id);
const agent = id => AGENTS.find(a=>a.id===id);

   3. STORAGE  (safe against private mode / blocked storage)
   --------------------------------------------------------------- */

function load(){

  catch(e){ /* storage unavailable — run in memory */ }

}

/* ---------------------------------------------------------------
   4. SCHEDULE ENGINE
   Builds a deterministic daily schedule from the roster + campaigns.
   Replace generateDay() with your own data source when you have one.
   --------------------------------------------------------------- */

const DAY_CAMPAIGNS   = CAMPAIGNS.filter(c=>['SEA','PH','APAC'].includes(c.region));
const EVE_CAMPAIGNS   = CAMPAIGNS.filter(c=>c.region==='EU');
const NIGHT_CAMPAIGNS = CAMPAIGNS.filter(c=>c.region==='NA');

function poolFor(band){
  if(band==='night') return NIGHT_CAMPAIGNS;
  if(band==='evening') return EVE_CAMPAIGNS;
  return DAY_CAMPAIGNS;
}

// Returns {exception} or {segments:[{start,end,campaignId,tl,fte}]}
function generateDay(agentId, dateStr){
  const a = agent(agentId);
  if(!a) return {segments:[]};
  const d = parseYmd(dateStr);
  if(isWeekend(d)) return {exception:'OFF'};

  const r = rnd(agentId+'|'+dateStr);
  // The demo sign-in agent always has a real shift, so the clock button is never hidden.
  if(agentId !== DEMO_AGENT){
    if(a.cls==='Trainee' && r<0.55) return {exception:'TRAINING'};
    if(r < 0.06) return {exception:'LEAVE'};
    if(r < 0.09) return {exception:'OFF'};
    if(r < 0.10) return {exception:'FORCED_LEAVE'};
  }

  const pool = poolFor(a.band);
  const pick = (salt)=>{
    const matched = pool.filter(c=>c.type===a.skill);
    const list = matched.length?matched:pool;
    return list[Math.floor(rnd(agentId+dateStr+salt)*list.length)%list.length];
  };

  const c1 = pick('A');
  const [ws,we] = REGION_WINDOW[c1.region];

  // ~18% of days are split shifts across two campaigns / two TLs
  const split = agentId===DEMO_AGENT ? true : rnd(agentId+dateStr+'split') < 0.18;
  if(!split) return {segments:[{start:ws,end:we,campaignId:c1.id,tl:c1.tl,fte:1}]};

  let c2 = pick('B');
  if(c2.id===c1.id) c2 = pool[(pool.indexOf(c1)+1)%pool.length];
  // a split day is more useful to look at when the two halves have different TLs
  if(c2.tl===c1.tl){
    const other = pool.find(c=>c.tl!==c1.tl);
    if(other) c2 = other;
  }
  // handover lands on a clean half hour, with a one-hour lunch between segments
  const mid = Math.round((ws + (we-ws)*0.42)/30)*30;
  return {segments:[
    {start:ws, end:mid, campaignId:c1.id, tl:c1.tl, fte:0.5},
    {start:mid+60, end:we, campaignId:c2.id, tl:c2.tl, fte:0.5},
  ]};
}

function scheduleFor(agentId, dateStr){
  const ov = DB.overrides[agentId+'|'+dateStr];
  return ov || generateDay(agentId, dateStr);
}

// Text in the format the team already reads:
// "8:30 AM to 6:00 PM Dell RSVP | TL: Cha"
function scheduleText(sched){
  if(sched.exception) return ({LEAVE:'Leave',OFF:'Rest day',FORCED_LEAVE:'Forced leave',
    TRAINING:'Training',HOLIDAY:'Holiday'})[sched.exception] || sched.exception;
  return sched.segments.map(s=>
    hhmm(s.start)+' to '+hhmm(s.end)+' '+campaign(s.campaignId).name+' | TL: '+s.tl
  ).join('  ');
}

/* ---------------------------------------------------------------
   5. CLOCK EVENTS + STATUS
   --------------------------------------------------------------- */
function nowMin(d=new Date()){ return d.getHours()*60 + d.getMinutes(); }
function todayStr(){ return ymd(new Date()); }

// A shift that starts at/after 6 PM belongs to the date it STARTED on,
// even though most of its hours fall on the next calendar day.
function shiftDateFor(date=new Date()){
  return nowMin(date) < 6*60 ? ymd(addDays(date,-1)) : ymd(date);
}

function eventsFor(agentId, dateStr){
  return DB.events.filter(e=>e.agentId===agentId && e.shiftDate===dateStr)
                  .sort((a,b)=>a.t-b.t);
}
function addEvent(agentId, type, dateStr){
  DB.events.push({agentId, type, t:Date.now(), shiftDate:dateStr,
                  ua:navigator.userAgent.slice(0,120), src:'web'});
  save();
}

function clockState(agentId, dateStr){
  const ev = eventsFor(agentId, dateStr);
  let inAt=null, outAt=null, onBreak=false, breakMs=0, lastBreak=null;
  for(const e of ev){
    if(e.type==='IN' && !inAt) inAt=e.t;
    if(e.type==='OUT') outAt=e.t;
    if(e.type==='BREAK_START'){ onBreak=true; lastBreak=e.t; }
    if(e.type==='BREAK_END'){ onBreak=false; if(lastBreak) breakMs+=e.t-lastBreak; lastBreak=null; }
  }
  if(onBreak && lastBreak) breakMs += Date.now()-lastBreak;
  return {inAt,outAt,onBreak,breakMs,hasEvents:ev.length>0};
}

// Seed a believable spread of clock-ins for everyone except the signed-in
// user, so the board is not empty on first open.
function seedToday(){
  const ds = todayStr();
  if(DB.events.some(e=>e.shiftDate===ds && e.src==='seed')) return;
  const now = nowMin();
  AGENTS.forEach(a=>{
    if(a.id===DEMO_AGENT) return;   // leave the demo agent un-clocked so the button is live
    const s = scheduleFor(a.id, ds);
    if(s.exception || !s.segments.length) return;
    const start = s.segments[0].start;
    if(now < start) return;                       // shift hasn't started yet
    const noShow = rnd(a.id+ds+'noshow');
    if(noShow > 0.88) return;                     // ~12% no clock-in -> MIA / Absent
    const lateRoll = rnd(a.id+ds+'lateroll');
    const lateBy = lateRoll > 0.75
      ? Math.round(9 + rnd(a.id+ds+'lmin')*45)    // ~25% arrive late
      : -Math.round(rnd(a.id+ds+'early')*12);     // the rest arrive a little early
    const t = new Date(); t.setHours(0, start+lateBy, 0, 0);
    if(t.getTime() > Date.now()) return;
    DB.events.push({agentId:a.id, type:'IN', t:t.getTime(), shiftDate:ds, src:'seed'});
  });
  save();
}

const STATUS = {
  IN:        {label:'Clocked In', cls:'p-ok',    color:'var(--ok)'},
  LATE:      {label:'Late',       cls:'p-warn',  color:'var(--warn)'},
  MIA:       {label:'MIA',        cls:'p-bad',   color:'var(--bad)'},
  ABSENT:    {label:'Absent',     cls:'p-bad',   color:'var(--bad)'},
  LEAVE:     {label:'On Leave',   cls:'p-info',  color:'var(--info)'},
  OFF:       {label:'Rest Day',   cls:'p-mute',  color:'var(--mute)'},
  TRAINING:  {label:'Training',   cls:'p-accent',color:'var(--accent)'},
  PENDING:   {label:'Not Yet Due',cls:'p-mute',  color:'var(--mute)'},
  BREAK:     {label:'On Break',   cls:'p-accent',color:'var(--accent)'},
  DONE:      {label:'Clocked Out',cls:'p-mute',  color:'var(--text-3)'},
  NOSCHED:   {label:'Not Scheduled',cls:'p-mute',color:'var(--mute)'},
};

function resolveStatus(agentId, dateStr){
  const sched = scheduleFor(agentId, dateStr);
  if(sched.exception){
    const k = sched.exception==='FORCED_LEAVE' ? 'LEAVE' : sched.exception;
    return {key:(STATUS[k]?k:'LEAVE'), sched, lateMin:0};
  }
  if(!sched.segments.length) return {key:'NOSCHED', sched, lateMin:0};

  const cs = clockState(agentId, dateStr);
  const start = sched.segments[0].start;
  const now = nowMin();
  const minsSinceStart = now - start;

  if(cs.inAt){
    const inD = new Date(cs.inAt);
    const lateMin = Math.max(0, (inD.getHours()*60+inD.getMinutes()) - start - SETTINGS.grace);
    if(cs.outAt) return {key:'DONE', sched, lateMin, cs};
    if(cs.onBreak) return {key:'BREAK', sched, lateMin, cs};
    return {key: lateMin>0 ? 'LATE' : 'IN', sched, lateMin, cs};
  }
  if(minsSinceStart < 0) return {key:'PENDING', sched, lateMin:0, cs};
  if(minsSinceStart >= SETTINGS.absent) return {key:'ABSENT', sched, lateMin:0, cs};
  if(minsSinceStart >= SETTINGS.mia)    return {key:'MIA', sched, lateMin:0, cs};
  return {key:'LATE', sched, lateMin:minsSinceStart-SETTINGS.grace, cs};
}

/* ---------------------------------------------------------------
   6. COVERAGE  (required FTE vs who is actually clocked in now)
   --------------------------------------------------------------- */
// True when `now` falls inside a window that may cross midnight.
// Windows are stored as minutes from midnight; an end over 1440 means next day.
function inWindowNow(start, end, now){
  if(end <= 1440) return now >= start && now <= end;
  return now >= start || now <= (end - 1440);
}

function coverage(dateStr){
  const now = nowMin();
  const rows = CAMPAIGNS.map(c=>{
    const [ws,we] = REGION_WINDOW[c.region];
    const row = {c, required:REQUIRED[c.id]||0, scheduled:0, actual:0, agents:[],
                 window:[ws,we], live:inWindowNow(ws,we,now)};
    AGENTS.forEach(a=>{
      const st = resolveStatus(a.id, dateStr);
      if(st.sched.exception) return;
      st.sched.segments.forEach(seg=>{
        if(seg.campaignId!==c.id) return;
        row.scheduled += seg.fte;
        const working = ['IN','LATE','BREAK'].includes(st.key);
        const counts = working && inWindowNow(seg.start, seg.end, now);
        if(counts) row.actual += seg.fte;
        row.agents.push({a, seg, st, counts});
      });
    });
    row.balance = row.actual - row.required;
    row.pct = row.required>0 ? row.actual/row.required : (row.actual>0?1:1);
    return row;
  });
  return rows;
}

/* ---------------------------------------------------------------
   7. CSV EXPORT
   --------------------------------------------------------------- */
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>{
    const s = v===null||v===undefined ? '' : String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a = el('a',{href:url, download:filename}); document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportRegister(dateStr){
  const rows=[['Date','Agent','Business Unit','Class','Scheduled','Campaign(s)','TL(s)','Clock In','Clock Out','Late (min)','Worked','Status']];
  AGENTS.forEach(a=>{
    const st=resolveStatus(a.id,dateStr), cs=st.cs||{};
    const camps=(st.sched.segments||[]).map(s=>campaign(s.campaignId).name).join(' / ');
    const tls=[...new Set((st.sched.segments||[]).map(s=>s.tl))].join(' / ');
    const worked = cs.inAt ? Math.round(((cs.outAt||Date.now())-cs.inAt-(cs.breakMs||0))/60000) : 0;
    rows.push([dateStr, a.name, a.unit, a.cls, scheduleText(st.sched), camps, tls,
      cs.inAt?new Date(cs.inAt).toLocaleTimeString():'',
      cs.outAt?new Date(cs.outAt).toLocaleTimeString():'',
      st.lateMin||0, cs.inAt?fmtDur(worked):'', STATUS[st.key].label]);
  });
  downloadCSV('attendance-register-'+dateStr+'.csv', rows);
}

function exportCoverage(dateStr){
  const rows=[['Date','Client','Campaign','Type','Region','TL','Shift Window','Required FTE','Scheduled FTE','Actual FTE','Balance','Coverage %']];
  coverage(dateStr).forEach(r=>{
    rows.push([dateStr, r.c.client, r.c.name, r.c.type, r.c.region, r.c.tl,
      hhmm(r.window[0])+' to '+hhmm(r.window[1]),
      r.required, fteTxt(r.scheduled), fteTxt(r.actual), fteTxt(r.balance),
      r.required?Math.round(r.pct*100)+'%':'n/a']);
  });
  downloadCSV('coverage-vs-requirement-'+dateStr+'.csv', rows);
}

          el('div',{class:'tiny'}, c.client+' · '+c.type+' · '+c.region))
      , el('span',{class:'chip', style:'align-self:center;color:'+(TL_COLOR[s.tl]||'var(--text-2)')},'TL: '+s.tl)));
    });

  wrap.appendChild(sc);

  // clock button

  if(canClock){
    const start=st.sched.segments[0].start, mins=nowMin()-start;

      const tooEarly = mins < -SETTINGS.earlyIn;

      }, tooEarly?'Opens at '+hhmm(start-SETTINGS.earlyIn):'Clock In'));
      wrap.appendChild(el('p',{class:'tiny',style:'text-align:center;margin-top:9px'},
        mins<0 ? 'Your shift starts in '+fmtDur(-mins) : isLate ? 'You are '+fmtDur(mins)+' past your start time' : 'Right on time'));
    } else if(!cs.outAt){
      const worked=Math.round((Date.now()-cs.inAt-cs.breakMs)/60000);
      wrap.appendChild(el('div',{class:'card',style:'padding:18px;margin-bottom:12px;text-align:center'},
        el('div',{class:'tiny',style:'margin-bottom:4px'}, cs.onBreak?'On break':'Time on shift'),
        el('div',{class:'timer'}, fmtDur(Math.max(0,worked))),
        el('div',{class:'tiny',style:'margin-top:4px'},'In at '+new Date(cs.inAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
          + (st.lateMin>0?' · '+st.lateMin+' min late':''))));
      wrap.appendChild(el('div',{class:'row2'},
        el('button',{class:'btn', style:'padding:14px', onclick:()=>{

        el('button',{class:'btn bigbtn stop', style:'padding:14px;font-size:15px', onclick:()=>{
          addEvent(aid,'OUT',ds);
          flashMsg='Clocked out at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
          setTimeout(()=>{flashMsg=null;render();},4000); render(); }},'Clock Out')
      ));
    } else {
      const worked=Math.round((cs.outAt-cs.inAt-cs.breakMs)/60000);
      wrap.appendChild(el('div',{class:'card',style:'padding:20px;text-align:center'},
        el('div',{style:'font-size:30px;margin-bottom:6px'},'✓'),
        el('h2',{},'Shift complete'),
        el('p',{class:'sub',style:'margin-top:6px'}, fmtDur(worked)+' worked · '+fmtDur(Math.round(cs.breakMs/60000))+' break'),
        el('p',{class:'tiny',style:'margin-top:8px'},'See you tomorrow.')));
    }
  }
  return wrap;
}

        el('div',{style:'margin-top:7px;font-size:13px;font-weight:550'}, campaign(s.campaignId).name),
        el('div',{class:'tiny'}, hhmm(s.start)+'–'+hhmm(s.end)),
        el('div',{class:'tiny',style:'color:'+(TL_COLOR[s.tl]||'var(--text-3)')},'TL: '+s.tl));
    });
    grid.appendChild(card);
  }
  wrap.appendChild(grid);
  return wrap;
}

/* ---------- supervisor: live board ---------- */
function Board(){
  const ds = shiftDateFor();
  const wrap=el('div',{});
  const u=DB.session;

  const rows = AGENTS.map(a=>({a, st:resolveStatus(a.id, ds)}));
  const counts = {};
  rows.forEach(r=>counts[r.st.key]=(counts[r.st.key]||0)+1);

  wrap.appendChild(el('div',{class:'page-head'},
    el('div',{},
      el('h1',{},'Live board'),
      el('p',{class:'sub'}, new Date().toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'})
        +' · shift date '+ds)),
    el('div',{class:'spacer'}),
    el('button',{class:'btn btn-sm', onclick:()=>exportRegister(ds)},'Export register (CSV)')
  ));

  wrap.appendChild(el('div',{class:'banner'},
    el('span',{},'ⓘ'),
    el('span',{},'Any TL can open any agent’s full day. Each segment is labelled with the TL who owns those hours — agents are shared between TLs within a single shift.')));

  // status strip
  const order=['IN','LATE','MIA','ABSENT','LEAVE','OFF','PENDING','BREAK','DONE','TRAINING'];
  const strip=el('div',{class:'strip'});
  order.forEach(k=>{
    if(!counts[k] && !['IN','LATE','MIA','ABSENT','LEAVE'].includes(k)) return;
    strip.appendChild(el('button',{class:'stat','aria-pressed':filterStatus===k?'true':'false',
      onclick:()=>{ filterStatus = filterStatus===k?null:k; render(); }},
      el('div',{class:'v'}, counts[k]||0),
      el('div',{class:'l'}, el('i',{class:'sq',style:'background:'+STATUS[k].color}), STATUS[k].label)));
  });
  wrap.appendChild(strip);

  // scope toggle
  const myTL = u.role==='tl' ? u.name : null;
  wrap.appendChild(el('div',{class:'toolbar'},
    el('button',{class:'btn btn-sm'+(filterScope==='all'?' btn-primary':''), onclick:()=>{filterScope='all';render();}},'All agents'),
    myTL && el('button',{class:'btn btn-sm'+(filterScope==='mine'?' btn-primary':''), onclick:()=>{filterScope='mine';render();}},'My segments'),
    filterStatus && el('button',{class:'btn btn-sm', onclick:()=>{filterStatus=null;render();}},'Clear filter: '+STATUS[filterStatus].label)
  ));

  // table
  let list = rows;
  if(filterStatus) list = list.filter(r=>r.st.key===filterStatus);
  if(filterScope==='mine' && myTL) list = list.filter(r=>(r.st.sched.segments||[]).some(s=>s.tl===myTL));

  const tb=el('tbody',{});
  list.forEach(({a,st})=>{
    const cs=st.cs||{};
    const segs=st.sched.segments||[];
    const ribbon=el('div',{class:'ribbon'});
    if(segs.length){
      const span=segs[segs.length-1].end-segs[0].start;
      segs.forEach(s=>ribbon.appendChild(el('span',{
        style:'flex:'+((s.end-s.start)/span)+';background:'+(TL_COLOR[s.tl]||'var(--mute)'),
        title:hhmm(s.start)+'–'+hhmm(s.end)+' · '+campaign(s.campaignId).name+' · TL: '+s.tl})));
    }
    const owns = myTL && segs.some(s=>s.tl===myTL);
    tb.appendChild(el('tr',{},
      el('td',{},
        el('div',{style:'display:flex;align-items:center;gap:9px'},
          el('span',{class:'avatar'},initials(a.name)),
          el('span',{},
            el('div',{class:'name'}, a.name),
            el('div',{class:'tiny'}, a.unit+' · '+a.cls)))),
      el('td',{},
        segs.length
          ? el('div',{},
              el('div',{style:'font-size:13px'}, segs.map(s=>campaign(s.campaignId).name).join(' → ')),
              el('div',{class:'tiny'}, segs.map(s=>hhmm(s.start)+'–'+hhmm(s.end)).join(', ')))
          : el('span',{class:'tiny'},'—')),
      el('td',{}, ribbon,
        el('div',{class:'tiny',style:'margin-top:4px'},
          [...new Set(segs.map(s=>s.tl))].map(t=>'TL: '+t).join(' · ')||'—')),
      el('td',{class:'r num'}, cs.inAt ? new Date(cs.inAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '—'),
      el('td',{class:'r num'}, st.lateMin>0 ? el('span',{style:'color:var(--warn);font-weight:600'}, st.lateMin+'m') : '—'),
      el('td',{}, pill(st.key)),
      el('td',{class:'r'}, owns || u.role==='admin'
        ? el('button',{class:'btn btn-sm', onclick:()=>{
            DB.overrides[a.id+'|'+ds]={exception:'LEAVE'}; save(); render(); }},'Mark leave')
        : el('span',{class:'tiny', title:'Owned by another TL'},'read-only'))
    ));
  });

  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'card-head'}, el('h2',{},'Agents'),
    el('span',{class:'tiny'}, list.length+' of '+rows.length+' shown')));
  card.appendChild(el('div',{class:'tablewrap'},
    el('table',{}, el('thead',{}, el('tr',{},
      ['Agent','Schedule','TL ownership','Clock in','Late','Status',''].map(h=>el('th',{class:h==='Clock in'||h==='Late'?'r':''},h)))), tb)));
  if(!list.length) card.appendChild(el('div',{class:'empty'}, el('div',{class:'big'},'✓'), el('p',{},'Nothing matches that filter.')));
  wrap.appendChild(card);

  // exceptions
  const exc = rows.filter(r=>['MIA','ABSENT','LATE'].includes(r.st.key));
  const ecard=el('div',{class:'card',style:'margin-top:16px'});
  ecard.appendChild(el('div',{class:'card-head'}, el('h2',{},'Needs attention'),
    el('span',{class:'pill '+(exc.length?'p-bad':'p-ok')}, exc.length?exc.length+' open':'All clear')));
  if(!exc.length){
    ecard.appendChild(el('div',{class:'empty'}, el('div',{class:'big'},'🌤'),
      el('p',{},'Nothing needs you right now.')));
  } else {
    exc.sort((x,y)=>({MIA:0,ABSENT:1,LATE:2})[x.st.key]-({MIA:0,ABSENT:1,LATE:2})[y.st.key]);
    exc.forEach(({a,st})=>{
      const segs=st.sched.segments||[];
      ecard.appendChild(el('div',{class:'exc'},
        pill(st.key),
        el('div',{class:'grow'},
          el('div',{class:'name'}, a.name),
          el('div',{class:'tiny'}, segs.length
            ? segs.map(s=>campaign(s.campaignId).name+' (TL: '+s.tl+') '+hhmm(s.start)).join(' · ')
            : '—')),
        el('span',{class:'tiny'}, st.key==='LATE' ? st.lateMin+' min late' : 'no clock-in')));
    });
  }
  wrap.appendChild(ecard);
  return wrap;
}

/* ---------- supervisor: coverage vs requirement ---------- */
function CoverageView(){
  const ds = shiftDateFor();
  const rows = coverage(ds).sort((a,b)=> (b.live-a.live) || (a.balance-b.balance));
  const wrap=el('div',{});

  wrap.appendChild(el('div',{class:'page-head'},
    el('div',{}, el('h1',{},'Coverage vs requirement'),
      el('p',{class:'sub'},'Required headcount against who is actually clocked in, right now')),
    el('div',{class:'spacer'}),
    el('button',{class:'btn btn-sm', onclick:()=>exportCoverage(ds)},'Export coverage (CSV)')));

  // Headline numbers cover only the campaigns whose shift window is open right now.
  // A night campaign that starts at 9 PM is not a shortfall at 10 AM.
  const liveRows = rows.filter(r=>r.live);
  const tot = liveRows.reduce((o,r)=>({req:o.req+r.required, act:o.act+r.actual, sch:o.sch+r.scheduled}),{req:0,act:0,sch:0});
  const bal = tot.act-tot.req;
  const dayTot = rows.reduce((n,r)=>n+r.required,0);
  const byUnit = {};
  liveRows.forEach(r=>{ const k=r.c.client; byUnit[k]=byUnit[k]||{req:0,act:0}; byUnit[k].req+=r.required; byUnit[k].act+=r.actual; });

  wrap.appendChild(el('div',{class:'rollups'},
    el('div',{class:'roll'}, el('div',{class:'k'},'Required now'), el('div',{class:'v'}, fteTxt(tot.req)),
      el('div',{class:'tiny'}, fteTxt(dayTot)+' across the full day')),
    el('div',{class:'roll'}, el('div',{class:'k'},'Scheduled'), el('div',{class:'v'}, fteTxt(tot.sch))),
    el('div',{class:'roll'}, el('div',{class:'k'},'Available now'), el('div',{class:'v'}, fteTxt(tot.act))),
    el('div',{class:'roll'}, el('div',{class:'k'},'Balance'),
      el('div',{class:'v bal '+(bal<0?'neg':bal>0?'pos':'zero')}, (bal>0?'+':'')+fteTxt(bal)),
      el('div',{class:'tiny'}, bal<0?'short by '+fteTxt(-bal)+' FTE':bal>0?'over by '+fteTxt(bal)+' FTE':'exactly met')),
    ...Object.entries(byUnit).map(([k,v])=>el('div',{class:'roll'},
      el('div',{class:'k'}, k+' balance'),
      el('div',{class:'v bal '+((v.act-v.req)<0?'neg':(v.act-v.req)>0?'pos':'zero')},
        ((v.act-v.req)>0?'+':'')+fteTxt(v.act-v.req))))
  ));

  const tb=el('tbody',{});
  rows.forEach(r=>{
    const pct=Math.min(1, r.required? r.actual/r.required : 1);
    const cls = !r.live ? 'ok' : r.balance<0 ? (pct<0.5?'bad':'warn') : r.balance>0 ? 'over' : 'ok';
    const dots=el('div',{class:'dots'});
    r.agents.slice(0,14).forEach(({a,st,counts})=>dots.appendChild(el('span',{
      class:'dot', title:a.name+' — '+STATUS[st.key].label,
      style:'background:'+(counts?STATUS[st.key].color:'transparent')+';border-color:'+STATUS[st.key].color})));
    if(!r.agents.length) dots.appendChild(el('span',{class:'tiny'},'nobody assigned'));

    tb.appendChild(el('tr',{},
      el('td',{}, el('div',{class:'name'}, r.c.name),
        el('div',{class:'tiny'}, r.c.client+' · '+r.c.type+' · TL: '+r.c.tl)),
      el('td',{class:'tiny'}, hhmm(r.window[0])+'–'+hhmm(r.window[1]),
        !r.live && el('div',{}, el('span',{class:'pill p-mute',style:'margin-top:3px'},'Not yet due'))),
      el('td',{class:'r num'}, fteTxt(r.required)),
      el('td',{class:'r num muted'}, fteTxt(r.scheduled)),
      el('td',{class:'r num', style:'font-weight:650'}, r.live?fteTxt(r.actual):'—'),
      el('td',{class:'r'}, r.live
        ? el('span',{class:'bal '+(r.balance<0?'neg':r.balance>0?'pos':'zero')}, (r.balance>0?'+':'')+fteTxt(r.balance))
        : el('span',{class:'tiny'},'—')),
      el('td',{style:'min-width:110px'},
        el('div',{class:'bar'}, el('i',{class:cls, style:'width:'+(r.live?pct*100:0)+'%'})),
        el('div',{class:'tiny',style:'margin-top:3px'},
          !r.live ? 'window closed' : r.required?Math.round(r.actual/r.required*100)+'% covered':'inbound')),
      el('td',{}, dots)
    ));
  });

  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'card-head'}, el('h2',{},'By campaign'),
    el('span',{class:'tiny'},'Worst shortfall first')));
  card.appendChild(el('div',{class:'tablewrap'},
    el('table',{}, el('thead',{}, el('tr',{},
      [['Campaign',''],['Window',''],['Required','r'],['Scheduled','r'],['Actual','r'],['Balance','r'],['Coverage',''],['Who','']]
        .map(([h,c])=>el('th',{class:c},h)))), tb)));
  wrap.appendChild(card);
  return wrap;
}

/* ---------- reports ---------- */
function Reports(){
  const ds=shiftDateFor();
  const rows=AGENTS.map(a=>({a, st:resolveStatus(a.id, ds)}));
  const late=rows.filter(r=>r.st.lateMin>0);
  const mia=rows.filter(r=>['MIA','ABSENT'].includes(r.st.key));
  const onLeave=rows.filter(r=>r.st.key==='LEAVE');
  const present=rows.filter(r=>['IN','LATE','BREAK','DONE'].includes(r.st.key));
  const scheduled=rows.filter(r=>!r.st.sched.exception && (r.st.sched.segments||[]).length);

  const wrap=el('div',{});
  wrap.appendChild(el('div',{class:'page-head'},
    el('div',{}, el('h1',{},'Reports'), el('p',{class:'sub'},'Shift date '+ds))));

  wrap.appendChild(el('div',{class:'rollups'},
    el('div',{class:'roll'}, el('div',{class:'k'},'Scheduled'), el('div',{class:'v'}, scheduled.length)),
    el('div',{class:'roll'}, el('div',{class:'k'},'Present'), el('div',{class:'v'}, present.length)),
    el('div',{class:'roll'}, el('div',{class:'k'},'Late'), el('div',{class:'v', style:'color:var(--warn)'}, late.length)),
    el('div',{class:'roll'}, el('div',{class:'k'},'MIA / Absent'), el('div',{class:'v', style:'color:var(--bad)'}, mia.length)),
    el('div',{class:'roll'}, el('div',{class:'k'},'On leave'), el('div',{class:'v', style:'color:var(--info)'}, onLeave.length)),
    el('div',{class:'roll'}, el('div',{class:'k'},'Attendance rate'),
      el('div',{class:'v'}, scheduled.length?Math.round(present.length/scheduled.length*100)+'%':'—'))
  ));

  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'card-head'}, el('h2',{},'Download')));
  card.appendChild(el('div',{class:'card-body', style:'display:flex;gap:9px;flex-wrap:wrap'},
    el('button',{class:'btn', onclick:()=>exportRegister(ds)},'Daily attendance register'),
    el('button',{class:'btn', onclick:()=>exportCoverage(ds)},'Coverage vs requirement'),
    el('button',{class:'btn', onclick:()=>{
      const r=[['Agent','Unit','Class','Status','Late (min)','Campaigns','TLs']];
      rows.forEach(({a,st})=>r.push([a.name,a.unit,a.cls,STATUS[st.key].label,st.lateMin||0,
        (st.sched.segments||[]).map(s=>campaign(s.campaignId).name).join(' / '),
        [...new Set((st.sched.segments||[]).map(s=>s.tl))].join(' / ')]));
      downloadCSV('exceptions-'+ds+'.csv', r);
    }},'Exception log')
  ));
  wrap.appendChild(card);

  const dcard=el('div',{class:'card', style:'margin-top:16px'});
  dcard.appendChild(el('div',{class:'card-head'}, el('h2',{},'Demo data'),
    el('span',{class:'tiny'},'Resets everything stored in this browser')));
  dcard.appendChild(el('div',{class:'card-body'},
    el('button',{class:'btn', onclick:()=>{
      if(confirm('Clear all clock-ins and overrides stored in this browser?')){
        DB.events=[]; DB.overrides={}; save(); seedToday(); render();
      }
    }},'Reset demo data')));
  wrap.appendChild(dcard);
  return wrap;
}

   9. BOOT
   --------------------------------------------------------------- */
load();
document.documentElement.dataset.theme = DB.theme || 'auto';
if(DB.session) seedToday();
render();
setInterval(()=>{ if(DB.session) render(); }, 30000);   // keep the board live
</script>
