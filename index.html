<!doctype html>
<html lang="en" data-theme="auto">
<head>

<title>Pulse Attendance</title>
<meta name="description" content="Employee attendance and clock-in board for G9 Outsourcing / NYTelecon.">
<style>

  --text:#14161a; --text-2:#5b6270; --text-3:#878f9c;
  --accent:#3b5bdb; --accent-soft:#eaeeff; --on-accent:#fff;
  --ok:#1a7f52; --ok-soft:#e6f4ed;
  --warn:#9a6212; --warn-soft:#fdf2e0;
  --bad:#b3261e; --bad-soft:#fdeceb;
  --info:#1f6f9c; --info-soft:#e7f2f8;
  --mute:#6b7280; --mute-soft:#f0f1f3;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --bg-sunk:#0a0b0e; --surface:#16191e; --surface-2:#1d2026;
  --border:#272b33; --border-strong:#353a44;
  --text:#eef0f3; --text-2:#a3abb8; --text-3:#767e8b;
  --accent:#748ffc; --accent-soft:#1c2338; --on-accent:#0e1013;
  --ok:#4ec08a; --ok-soft:#10261c; --warn:#e3b341; --warn-soft:#2a2113;
  --bad:#f28b82; --bad-soft:#2d1614; --info:#6fb6dd; --info-soft:#11232e;
  --mute:#9aa2ae; --mute-soft:#1d2026;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0e1013; --bg-sunk:#0a0b0e; --surface:#16191e; --surface-2:#1d2026;
  --border:#272b33; --border-strong:#353a44;
  --text:#eef0f3; --text-2:#a3abb8; --text-3:#767e8b;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
.hide{display:none !important}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:0 16px;height:60px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:7px 13px;border-radius:999px;color:var(--text-2);font-size:14px;font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.clock{font-size:14px;color:var(--text-2);font-weight:500;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--border)}
.who:hover{background:var(--surface-2)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);
  color:var(--accent);font-size:11px;font-weight:700;flex:none}
.main{padding:22px 16px 80px;max-width:1500px;margin:0 auto}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600}
.sub{color:var(--text-2);font-size:14px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-body{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:500;transition:background .12s}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-danger{color:var(--bad);border-color:var(--border-strong)}
.btn-sm{padding:5px 10px;font-size:13px}
.input,select.input{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface)}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap}
.pill .sq{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--mute-soft);color:var(--mute)} .p-accent{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;background:var(--surface-2);
  color:var(--text-2);font-size:11.5px;font-weight:600;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;text-align:left}
.stat:hover{border-color:var(--border-strong)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat .v{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.stat .l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);font-weight:500;margin-top:3px}
.stat .l .sq{width:8px;height:8px;border-radius:2px;flex:none}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:2}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-sunk)}
.r{text-align:right} .c{text-align:center}
.name{font-weight:550} .muted{color:var(--text-2)} .tiny{font-size:12px;color:var(--text-3)}
.bar{position:relative;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;display:block}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.over{background:var(--info)}
.bal{font-weight:650} .bal.neg{color:var(--bad)} .bal.pos{color:var(--info)} .bal.zero{color:var(--text-2)}
.rollups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.roll{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg-sunk)}
.roll .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600}
.roll .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.ribbon{display:flex;height:7px;border-radius:999px;overflow:hidden;background:var(--surface-2);min-width:90px}
.ribbon span{display:block;height:100%}
.dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}
.agentwrap{max-width:560px;margin:0 auto}
.hero{text-align:center;padding:10px 0 22px}
.hero .hi{font-size:15px;color:var(--text-2)}
.hero .now{font-size:46px;font-weight:650;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.hero .date{font-size:13.5px;color:var(--text-3);margin-top:2px}
.schedcard{padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);margin-bottom:14px}
.seg{display:flex;gap:12px;padding:11px 0;border-top:1px dashed var(--border)}
.seg:first-of-type{border-top:none;padding-top:4px}
.seg .time{font-weight:600;white-space:nowrap;font-size:14px}
.bigbtn{width:100%;padding:20px;border-radius:var(--radius);font-size:19px;font-weight:650;letter-spacing:-.01em;border:1px solid transparent;transition:transform .08s}
.bigbtn:active{transform:scale(.985)}
.bigbtn.go{background:var(--ok);color:#fff}
.bigbtn.late{background:#f0a429;color:#3a2600}
.bigbtn.stop{background:var(--surface);border-color:var(--border-strong)}
.bigbtn[disabled]{opacity:.55;cursor:not-allowed}
.timer{font-size:40px;font-weight:650;letter-spacing:-.03em;text-align:center;line-height:1.1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flash{background:var(--ok-soft);color:var(--ok);border-radius:var(--radius);padding:13px 15px;font-weight:600;

@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.loginwrap{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg-sunk)}
.loginbox{width:100%;max-width:400px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.quick{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.quick button{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;font-size:13.5px}
.quick button:hover{background:var(--surface-2);border-color:var(--border-strong)}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--text-3);font-size:11.5px;font-weight:600;letter-spacing:.05em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty .big{font-size:34px;margin-bottom:8px}
.exc{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border)}
.exc:last-child{border-bottom:none}
.exc .grow{flex:1;min-width:0}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daycard{border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;background:var(--surface)}
.daycard.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.banner{background:var(--accent-soft);color:var(--accent);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;
  margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.subnav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);overflow-x:auto}
.subnav button{padding:9px 14px;font-size:14px;font-weight:550;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.subnav button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.gridcell{width:58px;padding:5px 6px;text-align:center;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px}
.gridcell:focus{outline:2px solid var(--accent);outline-offset:-1px}
.gridcell.dflt{color:var(--text-3)}
.gridcell.set{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
.sticky-first td:first-child,.sticky-first th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.sticky-first tbody tr:hover td:first-child{background:var(--bg-sunk)}
.tl{position:relative;height:9px;border-radius:999px;background:var(--surface-2);margin-top:8px;min-width:150px}
.tl-sm{height:7px;margin-top:4px}
.tlseg{position:absolute;top:0;bottom:0;border-radius:3px}

  box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal .card-head{position:sticky;top:0;background:var(--surface)}
.manual{background:var(--accent-soft);color:var(--accent);font-weight:650}
footer.note{max-width:1500px;margin:0 auto;padding:0 16px 40px;color:var(--text-3);font-size:12.5px}
@media (max-width:640px){.main{padding:16px 12px 70px}h1{font-size:22px}.hero .now{font-size:40px}.clock{display:none}}
</style>

<div id="app"></div>
<script>
/* ===========================================================================
   PULSE — Employee Attendance & Clock-In
   Single file. No build step, no server, no dependencies.

   HOW THE SCHEDULE WORKS
   ----------------------
   You do NOT write schedules by hand. You maintain two things in Admin:
     1. the campaign list, and
     2. the mandays each campaign needs per day.
   The app works out who goes where, every time it loads. Change the mandays,
   the schedule changes. Nothing else to update.
   =========================================================================== */

/* ---------------------------------------------------------------
   1. FIXED REFERENCE DATA
   --------------------------------------------------------------- */

// Shift windows, in minutes from midnight. A value over 1440 means next day.
const REGION_WINDOW = {
  AU:   [7*60,     16*60+30],   // 7:00 AM – 4:30 PM
  SEA:  [8*60+30,  18*60],      // 8:30 AM – 6:00 PM
  APAC: [8*60+30,  18*60],
  PH:   [8*60,     16*60],      // 8:00 AM – 4:00 PM
  MEA:  [12*60+30, 22*60],      // 12:30 PM – 10:00 PM
  EU:   [15*60+30, 25*60],      // 3:30 PM – 1:00 AM
  NA:   [21*60,    30*60+30],   // 9:00 PM – 6:30 AM
};
const REGIONS = Object.keys(REGION_WINDOW);
const TYPES   = ['LQ','RSVP','CS','DP','Research','Non-Voice','F2F','Webinar'];
const STATUSES= ['Ongoing','Upcoming','Ending','Paused','Completed'];
const UNITS   = ['Incall','Fervent'];
const CLASSES = ['Senior','Temp','Trainee','Freelancer'];
const BANDS   = ['day','evening','night'];

const TL_COLOR = {Cha:'#3b5bdb',Jovi:'#0b7285',Maricel:'#9c36b5',Allen:'#2b8a3e',
  Kurtnie:'#c2410c',Rizza:'#a61e4d',Christine:'#5c7cfa',Cathy:'#0ca678',TJ:'#7048e8',Tessa:'#495057'};

const SETTINGS = {grace:5, mia:30, absent:120, earlyIn:60};

// One manday = this many productive hours. Everything converts through it:
// 1 manday = 8h, 0.5 = 4h, 0.25 = 2h, 0.125 = 1h.
const WORK_HOURS = 8;
const WORK_MIN = WORK_HOURS*60;          // 8h of actual work
const BREAK_MIN = 90;                    // 1h30 unpaid break
const SHIFT_SPAN_MIN = WORK_MIN+BREAK_MIN;   // 9h30 on shift, start to finish

/* A campaign's shift window. Each campaign has its own start time; the finish
   is always start + 9h30. The break sits in the middle, splitting the day into
   two 4-hour work halves. */
function winOf(c){
  const st=(c&&c.start!=null) ? Number(c.start) : (REGION_WINDOW[(c&&c.region)||'SEA']||REGION_WINDOW.SEA)[0];
  return [st, st+SHIFT_SPAN_MIN];
}
function halvesOf(c){
  const w=winOf(c);
  return [[w[0], w[0]+WORK_MIN/2], [w[0]+WORK_MIN/2+BREAK_MIN, w[1]]];
}
const winOfId = id => winOf(campaign(id));

// How long one agent's stint on a campaign lasts. 'full' = the whole shift window.
const BLOCKS = [['full','Full shift'],['4','4 hours'],['2','2 hours'],['1','1 hour']];
const blockMinutes = b => b==='full' ? null : Number(b)*60;

// Day statuses an admin or TL can set against an agent.
// The first four are the ones that stop an agent being scheduled at all.
const EXC_OPTIONS = [
  ['',             'Working (normal)'],
  ['LEAVE',        'Leave'],
  ['FORCED_LEAVE', 'Forced leave'],
  ['AWOL',         'AWOL'],
  ['HALF_AM',      'Half day — works morning'],
  ['HALF_PM',      'Half day — works afternoon'],
  ['OFF',          'Rest day'],
  ['TRAINING',     'Training'],
  ['HOLIDAY',      'Holiday'],
];
const EXC_LABEL = Object.fromEntries(EXC_OPTIONS.filter(x=>x[0]).concat([['HALF_DAY','Half day — works morning']]));
const DEMO_AGENT = 'a1';

const USERS = [
  {email:'abi@nytelecon.com',   name:'Abi Esmao',   role:'agent', agentId:'a1'},
  {email:'cha@nytelecon.com',   name:'Cha',         role:'tl'},
  {email:'jovi@nytelecon.com',  name:'Jovi',        role:'tl'},
  {email:'tessa@nytelecon.com', name:'Tessa Jacob', role:'admin'},
];

/* ---------------------------------------------------------------
   2. STARTING DATA  (replaced by data.json once you publish one)
   --------------------------------------------------------------- */
const DEFAULT_DATA = {
  meta:{updated:null, note:'Built-in starting data'},
  campaigns:[
    {id:'c1', name:'Dell RSVP',     client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:3, block:'full', start:8*60+30},
    {id:'c2', name:'SAP Now',       client:'Incall',  type:'CS',      region:'SEA',  tl:'Maricel',   status:'Ongoing', mandays:3, block:'full', start:8*60+30},
    {id:'c3', name:'Google RSVP',   client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:1.5, block:'full', start:8*60+30},
    {id:'c4', name:'Lenovo LQ',     client:'Incall',  type:'LQ',      region:'SEA',  tl:'Jovi',      status:'Ongoing', mandays:1, block:'full', start:8*60+30},
    {id:'c5', name:'Checkpoint LQ', client:'Incall',  type:'LQ',      region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:1, block:'full', start:8*60+30},
    {id:'c6', name:'Cohesity RSVP', client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Jovi',      status:'Ongoing', mandays:1, block:'full', start:8*60+30},
    {id:'c7', name:'Ingram Micro',  client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Jovi',      status:'Ongoing', mandays:1, block:'full', start:8*60+30},
    {id:'c8', name:'Fujitsu RSVP',  client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:0.5, block:'full', start:8*60+30},
    {id:'c9', name:'Starhub LQ',    client:'Incall',  type:'LQ',      region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:1, block:'full', start:8*60+30},
    {id:'c10',name:'SOG',           client:'Incall',  type:'CS',      region:'PH',   tl:'Christine', status:'Ongoing', mandays:1, block:'full', start:8*60},
    {id:'c11',name:'Fervent SEA',   client:'Fervent', type:'Webinar', region:'APAC', tl:'Allen',     status:'Ongoing', mandays:1, block:'full', start:8*60+30},
    {id:'c12',name:'Fervent EU',    client:'Fervent', type:'Webinar', region:'EU',   tl:'Kurtnie',   status:'Ongoing', mandays:1.5, block:'full', start:15*60+30},
    {id:'c13',name:'Fervent NA',    client:'Fervent', type:'Webinar', region:'NA',   tl:'Rizza',     status:'Ongoing', mandays:2, block:'full', start:21*60},
  ],
  agents:[
    {id:'a1', name:'Abi Esmao',             unit:'Incall',  cls:'Senior',     skill:'LQ',      band:'day',     active:true},

function el(t,p={},...kids){

  kids.flat().forEach(k=>{ if(k===null||k===undefined||k===false)return;

/* Locked days keep their own copy of the campaigns and roster as they were that
   day, so renaming or deleting a campaign never rewrites history. */
let _snap=null;
function snap(){
  if(_snap) return _snap;
  _snap={c:{},a:{}};
  Object.values(D().history||{}).forEach(h=>{
    Object.entries(h.campaigns||{}).forEach(([k,v])=>{ if(!_snap.c[k]) _snap.c[k]=v; });
    Object.entries(h.roster||{}).forEach(([k,v])=>{ if(!_snap.a[k]) _snap.a[k]=v; });
  });
  return _snap;
}
const campaign = id => D().campaigns.find(c=>c.id===id) || snap().c[id] || null;
const agent    = id => D().agents.find(a=>a.id===id)   || snap().a[id] || null;

const lockedDay = ds => (D().history||{})[ds] || null;
const segsOf = a => (a && a.segments) || [];

/* Campaign details for a segment. A locked segment carries its own copy, so a
   campaign renamed or deleted later never rewrites what the record says. */
function cinfo(seg){
  if(seg && seg.cname) return {id:seg.campaignId, name:seg.cname, client:seg.cclient||'',
                               type:seg.ctype||'', region:seg.cregion||'SEA', tl:seg.tl};
  const c=campaign(seg&&seg.campaignId);
  return c || {id:seg&&seg.campaignId, name:'(removed campaign)', client:'', type:'', region:'SEA', tl:seg&&seg.tl};
}
const rosterFor = ds => { const h=lockedDay(ds);
  return h&&h.roster ? Object.values(h.roster) : D().agents; };

// Mandays for a campaign on a date: the date-specific value, else the campaign default.
function requiredFor(cid, dateStr){
  const h=lockedDay(dateStr);
  if(h&&h.required&&h.required[cid]!==undefined) return Number(h.required[cid]);
  const r = D().required||{};
  if(r[cid] && r[cid][dateStr]!==undefined && r[cid][dateStr]!==null && r[cid][dateStr]!=='') return Number(r[cid][dateStr]);
  const c = campaign(cid);
  return c ? Number(c.mandays||0) : 0;
}
function requiredIsOverride(cid,dateStr){
  const r=D().required||{};
  return !!(r[cid] && r[cid][dateStr]!==undefined && r[cid][dateStr]!==null && r[cid][dateStr]!=='');
}
function exceptionFor(aid, dateStr){
  const e=(D().exceptions||{})[aid+'|'+dateStr];
  if(e) return e;
  if(isWeekend(parseYmd(dateStr))) return 'OFF';
  return null;
}

/* ---------------------------------------------------------------
   5. THE AUTO-SCHEDULER
   Reads: campaigns + mandays + who is available.
   Writes: nothing. It recalculates every time, so the schedule can
   never drift out of step with the numbers you entered.

   Capacity is counted in HALF-DAYS, so 0.5 mandays is expressible.
   A day agent has 2 half-days (morning, afternoon).
   --------------------------------------------------------------- */
function bandForRegion(region){
  if(region==='NA') return 'night';
  if(region==='EU') return 'evening';
  return 'day';           // AU, SEA, APAC, PH, MEA
}

/* Time maths. Minutes from midnight; values over 1440 mean the next day,
   which is how the EU and NA shifts stay on the right shift date. */
const overlaps=(a,b)=>a.start<b.end&&b.start<a.end;

/* Earliest free stretch of `durMin` inside this campaign's shift.
   Anything shorter than a full shift has to sit inside one of the two 4-hour
   work halves, so nobody is scheduled straight through the break.
   `restrict` limits a half-day agent to their own half. */
function findSlot(busy, c, durMin, restrict){
  const win=winOf(c), hv=halvesOf(c);
  const tryRange=(lo,hi)=>{
    for(let st=lo; st+durMin<=hi; st+=30){
      const cand={start:st,end:st+durMin};
      if(!busy.some(b=>overlaps(cand,b))) return cand;
    }
    return null;
  };
  if(durMin>=win[1]-win[0]){
    const cand={start:win[0],end:win[1]};
    return busy.some(b=>overlaps(cand,b))?null:cand;
  }
  const ranges = restrict==='am' ? [hv[0]] : restrict==='pm' ? [hv[1]] : [hv[0],hv[1]];
  for(const r of ranges){ const got=tryRange(r[0],r[1]); if(got) return got; }
  return null;
}

const _schedCache={};
function buildSchedule(dateStr){
  if(_schedCache[dateStr]) return _schedCache[dateStr];

  // A locked day is served exactly as it was recorded — never recalculated.
  const frozen=lockedDay(dateStr);
  if(frozen){
    const asg=frozen.assignments||{};
    Object.values(asg).forEach(a=>{ if(!a.segments) a.segments=[]; });
    const out={assignments:asg, gaps:frozen.gaps||[], dateStr, locked:true};
    _schedCache[dateStr]=out; return out;
  }

  const data=D();
  const agents=data.agents.filter(a=>a.active!==false);
  const capMin={}, exc={}, restrict={}, note={}, busy={}, placed={};

  agents.forEach(a=>{
    const e=exceptionFor(a.id,dateStr);
    exc[a.id]=null; restrict[a.id]=null; note[a.id]=null;
    capMin[a.id]=WORK_MIN; busy[a.id]=[]; placed[a.id]=[];
    if(!e) return;
    if(e==='HALF_AM'||e==='HALF_DAY'){ capMin[a.id]=WORK_MIN/2; restrict[a.id]='am'; note[a.id]='HALF_AM'; }
    else if(e==='HALF_PM'){ capMin[a.id]=WORK_MIN/2; restrict[a.id]='pm'; note[a.id]='HALF_PM'; }
    else { exc[a.id]=e; capMin[a.id]=0; }   // LEAVE, FORCED_LEAVE, AWOL, OFF, TRAINING, HOLIDAY
  });

  // Put one stint on an agent's day. Returns the minutes credited, or 0.
  // `want` is the time the stint occupies; `charge` is the work it counts as.
  // A full shift window spans a lunch break, so it occupies 9h30 but counts as 8h.
  function place(aid, c, durMin, manual, maxCharge){
    if(capMin[aid]<=0) return 0;
    const win=winOf(c), winLen=win[1]-win[0];
    let want=Math.min(durMin, winLen);
    let charge = want>=winLen ? Math.min(WORK_MIN, winLen) : want;
    if(maxCharge && charge>maxCharge){ charge=Math.max(60,Math.round(maxCharge/30)*30); want=Math.min(want,charge); }
    if(charge>capMin[aid]){ charge=capMin[aid]; want=Math.min(want,charge); }
    if(charge<=0) return 0;
    const slot=findSlot(busy[aid], c, want, restrict[aid]);
    if(!slot) return 0;
    busy[aid].push(slot);
    placed[aid].push({start:slot.start, end:slot.end, campaignId:c.id, tl:c.tl,
                      fte:charge/WORK_MIN, manual:!!manual});
    capMin[aid]-=charge;
    return charge;
  }

  // --- 1. manual pins first; the auto-assigner works around them -----------
  const pins=data.overrides||{};
  const pinnedMin={};
  agents.forEach(a=>{
    const ov=pins[a.id+'|'+dateStr];
    if(!ov||capMin[a.id]<=0) return;
    (normaliseOverride(ov)||[]).forEach(seg=>{
      const c=campaign(seg.campaignId); if(!c) return;
      const win=winOf(c);
      const st=(seg.start==null)?win[0]:seg.start;
      const dur=seg.mins||(win[1]-win[0]);
      const cand={start:st,end:st+dur};
      if(busy[a.id].some(b=>overlaps(cand,b))) return;        // ignore a clash
      const credit=Math.min(dur,capMin[a.id]);
      busy[a.id].push(cand);
      placed[a.id].push({start:cand.start,end:cand.end,campaignId:c.id,tl:c.tl,
                         fte:credit/WORK_MIN, manual:true});
      capMin[a.id]-=credit;
      pinnedMin[c.id]=(pinnedMin[c.id]||0)+credit;
    });
  });

  // --- 2. auto-fill the rest ----------------------------------------------
  const demand = data.campaigns
    .filter(c=>c.status!=='Paused'&&c.status!=='Completed'&&c.status!=='Upcoming')
    .map(c=>{
      const asked=Math.round(requiredFor(c.id,dateStr)*WORK_MIN);
      return {c, asked, need:Math.max(0, asked-(pinnedMin[c.id]||0))};
    })
    .filter(x=>x.need>0)
    .sort((x,y)=> y.need-x.need || x.c.id.localeCompare(y.c.id));

  const gaps=[];
  demand.forEach(({c,need})=>{
    const want=bandForRegion(c.region);
    const win=winOf(c);
    const blk=blockMinutes(c.block||'full');
    let left=need;

    // several passes: a 1-hour block campaign may take many agents
    for(let pass=0; pass<8 && left>0; pass++){
      const eligible=agents
        .filter(a=>capMin[a.id]>0 && a.band===want)      // band is a hard rule for auto-assignment
        .sort((x,y)=>{
          const sc=a=>(a.skill===c.type?0:10)+(placed[a.id].length?3:0)+(capMin[a.id]<WORK_MIN?1:0);
          return sc(x)-sc(y)||x.id.localeCompare(y.id);
        });
      if(!eligible.length) break;
      let movedThisPass=0;
      for(const a of eligible){
        if(left<=0) break;
        const dur = blk===null ? (win[1]-win[0]) : blk;
        const got=place(a.id, c, dur, false, left);
        if(got>0){ left-=got; movedThisPass+=got; }
      }
      if(!movedThisPass) break;
    }

    if(left>0){
      const inBand=agents.filter(a=>a.band===want);
      const free=inBand.filter(a=>capMin[a.id]>0);
      gaps.push({campaignId:c.id, unfilled:left/WORK_MIN,
        reason: inBand.length===0
          ? 'No agent is on the '+want+' shift band this campaign needs.'
          : free.length===0
            ? 'All '+inBand.length+' '+want+'-band agents are fully booked (leave, half days and manual assignments included).'
            : 'The '+free.length+' agents still free have no gap long enough inside this campaign\u2019s '
              +hhmm(win[0])+'\u2013'+hhmm(win[1])+' window.'});
    }
  });

  // --- 3. tidy up into segments -------------------------------------------
  const assignments={};
  agents.forEach(a=>{
    if(exc[a.id]){ assignments[a.id]={exception:exc[a.id], segments:[], note:null}; return; }
    const segs=placed[a.id].slice().sort((x,y)=>x.start-y.start);
    // merge touching stints on the same campaign so the day reads cleanly
    const merged=[];
    segs.forEach(sg=>{
      const last=merged[merged.length-1];
      if(last && last.campaignId===sg.campaignId && last.end===sg.start){
        last.end=sg.end; last.fte+=sg.fte; last.manual=last.manual||sg.manual;
      } else merged.push(Object.assign({},sg));
    });
    assignments[a.id]={exception:null, segments:merged, note:note[a.id],
                       idle:!merged.length, freeMin:capMin[a.id]};
  });

  const out={assignments, gaps, dateStr};
  _schedCache[dateStr]=out;
  return out;
}

// Overrides used to be {am,pm}. Accept both shapes.
function normaliseOverride(ov){
  if(!ov) return null;
  if(Array.isArray(ov.segments)) return ov.segments;
  const out=[];
  const half=cid=>{ const c=campaign(cid); if(!c) return null;
    const h=halvesOf(c); return {w:winOf(c), am:h[0], pm:h[1]}; };
  if(ov.am&&ov.pm&&ov.am===ov.pm){ const h=half(ov.am); if(h) out.push({campaignId:ov.am,start:h.w[0],mins:h.w[1]-h.w[0]}); return out; }
  if(ov.am){ const h=half(ov.am); if(h) out.push({campaignId:ov.am,start:h.am[0],mins:h.am[1]-h.am[0]}); }
  if(ov.pm){ const h=half(ov.pm); if(h) out.push({campaignId:ov.pm,start:h.pm[0],mins:h.pm[1]-h.pm[0]}); }
  return out;
}

function clearSchedCache(){ for(const k in _schedCache) delete _schedCache[k]; _snap=null; }

/* ---------------------------------------------------------------
   5b. LOCKING A DAY
   Freezes that date's allocation, plus the mandays, campaigns and
   roster behind it, so the record stops moving when you change
   anything afterwards.
   --------------------------------------------------------------- */
function lockDay(ds, quiet){
  const s=buildSchedule(ds);
  // Keep the snapshot small: only what a record needs to be read back later.
  const required={}, campaigns={}, roster={};
  D().campaigns.forEach(c=>{
    const need=requiredFor(c.id,ds);
    if(need>0) required[c.id]=need;
    campaigns[c.id]={id:c.id,name:c.name,client:c.client,type:c.type,region:c.region,tl:c.tl};
  });
  D().agents.forEach(a=>{ roster[a.id]={id:a.id,name:a.name,unit:a.unit,cls:a.cls,band:a.band,skill:a.skill}; });
  const payload={
    lockedAt:new Date().toISOString(),
    lockedBy:(DB.session&&DB.session.name)||'admin',
    assignments:(function(){
      const copy=JSON.parse(JSON.stringify(s.assignments));
      Object.values(copy).forEach(a=>{
        delete a.freeMin; delete a.idle;
        (a.segments||[]).forEach(sg=>{
          const c=campaign(sg.campaignId);
          if(c){ sg.cname=c.name; sg.cclient=c.client; sg.ctype=c.type; sg.cregion=c.region; }
          if(!sg.manual) delete sg.manual;
        });
        if(!a.segments||!a.segments.length) delete a.segments;
        if(!a.note) delete a.note;
        if(!a.exception) delete a.exception;
      });
      return copy;
    })(),
    gaps:JSON.parse(JSON.stringify(s.gaps||[])),
    required, campaigns, roster};
  editData(d=>{ d.history=d.history||{}; d.history[ds]=payload; });
  clearSchedCache();
  if(!quiet) render();
}
function unlockDay(ds){ editData(d=>{ if(d.history) delete d.history[ds]; }); clearSchedCache(); render(); }

/* Settings that live in the data file, so they publish with everything else. */
function appSettings(){
  return Object.assign({autoLock:true, autoLockAfterDays:1, autoLockWindowDays:14}, D().settings||{});
}
function setSetting(k,v){ touched(d=>{ d.settings=d.settings||{}; d.settings[k]=v; }); }

/* Auto-lock. There is no server here, so "automatic" means it runs when an
   admin opens the app — not overnight on its own. It only locks days that
   actually had an allocation, and the result is an unpublished change like
   any other until you publish it. */
let _autoLockRan=false, autoLockMsg=null;
function runAutoLock(){
  if(_autoLockRan) return 0;
  _autoLockRan=true;
  if(!DB.session || DB.session.role!=='admin') return 0;
  const st=appSettings();
  if(!st.autoLock) return 0;
  const today=parseYmd(todayStr());
  const done=[];
  for(let i=Math.max(1,st.autoLockAfterDays); i<=st.autoLockWindowDays; i++){
    const d=addDays(today,-i);
    if(isWeekend(d)) continue;
    const ds=ymd(d);
    if(lockedDay(ds)) continue;
    if(daySummary(ds).mandays<=0) continue;      // nothing was allocated, nothing to record
    lockDay(ds,true);
    done.push(ds);
  }
  if(done.length){
    clearSchedCache();
    autoLockMsg=done.length+' past day'+(done.length===1?'':'s')+' locked automatically ('
      +done.slice(0,4).join(', ')+(done.length>4?' and '+(done.length-4)+' more':'')
      +'). Publish to share the record with everyone else.';
  }
  return done.length;
}

function historySizeKB(){
  try{ return Math.round(JSON.stringify(D().history||{}).length/1024); }catch(e){ return 0; }
}
function pruneHistory(days){
  const cut=ymd(addDays(new Date(),-days));
  const gone=Object.keys(D().history||{}).filter(k=>k<cut);
  if(!gone.length){ alert('Nothing is older than '+days+' days.'); return; }
  if(!confirm('Permanently remove '+gone.length+' locked day'+(gone.length===1?'':'s')+' older than '+days+' days? Export them first if you need them.')) return;
  touched(d=>{ gone.forEach(k=>delete d.history[k]); });
}

function daySummary(ds){
  const s=buildSchedule(ds);
  let mandays=0, people=0, exceptions=0;
  Object.values(s.assignments).forEach(a=>{
    const m=(a.segments||[]).reduce((n,x)=>n+x.fte,0);
    if(m>0){ mandays+=m; people++; }
    if(a.exception) exceptions++;
  });
  return {mandays, people, exceptions, unfilled:(s.gaps||[]).reduce((n,g)=>n+g.unfilled,0), locked:!!s.locked};
}

function scheduleFor(aid, dateStr){
  const s=buildSchedule(dateStr).assignments[aid];
  return s || {exception:null, segments:[], idle:true};
}
function scheduleText(s){
  if(s.exception) return EXC_LABEL[s.exception]||s.exception;
  if(!s.segments.length) return 'Unassigned';
  return s.segments.map(x=>hhmm(x.start)+' to '+hhmm(x.end)+' '+cinfo(x).name+' | TL: '+x.tl).join('  ');
}

const nowMin=(d=new Date())=>d.getHours()*60+d.getMinutes();
const todayStr=()=>ymd(new Date());
// A shift starting at/after 6 PM belongs to the date it STARTED on.
const shiftDateFor=(d=new Date())=> nowMin(d)<6*60 ? ymd(addDays(d,-1)) : ymd(d);

function rnd(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0)%100000)/100000}

const eventsFor=(aid,ds)=>DB.events.filter(e=>e.agentId===aid&&e.shiftDate===ds).sort((a,b)=>a.t-b.t);
function addEvent(aid,type,ds){
  DB.events.push({agentId:aid,type,t:Date.now(),shiftDate:ds,src:'web',ua:navigator.userAgent.slice(0,120)});
  save();
}
function clockState(aid,ds){
  const ev=eventsFor(aid,ds);
  let inAt=null,outAt=null,onBreak=false,breakMs=0,lastBreak=null;
  for(const e of ev){
    if(e.type==='IN'&&!inAt) inAt=e.t;
    if(e.type==='OUT') outAt=e.t;
    if(e.type==='BREAK_START'){onBreak=true;lastBreak=e.t}
    if(e.type==='BREAK_END'){onBreak=false;if(lastBreak)breakMs+=e.t-lastBreak;lastBreak=null}
  }
  if(onBreak&&lastBreak) breakMs+=Date.now()-lastBreak;
  return {inAt,outAt,onBreak,breakMs};
}
function seedToday(){
  const ds=todayStr();
  if(DB.events.some(e=>e.shiftDate===ds&&e.src==='seed')) return;
  const now=nowMin();
  D().agents.forEach(a=>{
    if(a.id===DEMO_AGENT) return;
    const s=scheduleFor(a.id,ds);
    if(s.exception||!s.segments.length) return;
    const start=s.segments[0].start;
    if(now<start) return;
    if(rnd(a.id+ds+'noshow')>0.88) return;
    const lateBy = rnd(a.id+ds+'lateroll')>0.75 ? Math.round(9+rnd(a.id+ds+'lmin')*45) : -Math.round(rnd(a.id+ds+'early')*12);
    const t=new Date(); t.setHours(0,start+lateBy,0,0);
    if(t.getTime()>Date.now()) return;
    DB.events.push({agentId:a.id,type:'IN',t:t.getTime(),shiftDate:ds,src:'seed'});
  });
  save();
}

const STATUS={
  IN:{label:'Clocked In',cls:'p-ok',color:'var(--ok)'},
  LATE:{label:'Late',cls:'p-warn',color:'var(--warn)'},
  MIA:{label:'MIA',cls:'p-bad',color:'var(--bad)'},
  ABSENT:{label:'Absent',cls:'p-bad',color:'var(--bad)'},
  LEAVE:{label:'On Leave',cls:'p-info',color:'var(--info)'},
  FORCED_LEAVE:{label:'Forced Leave',cls:'p-info',color:'var(--info)'},
  AWOL:{label:'AWOL',cls:'p-bad',color:'var(--bad)'},
  OFF:{label:'Rest Day',cls:'p-mute',color:'var(--mute)'},
  TRAINING:{label:'Training',cls:'p-accent',color:'var(--accent)'},
  HOLIDAY:{label:'Holiday',cls:'p-info',color:'var(--info)'},
  PENDING:{label:'Not Yet Due',cls:'p-mute',color:'var(--mute)'},
  BREAK:{label:'On Break',cls:'p-accent',color:'var(--accent)'},
  DONE:{label:'Clocked Out',cls:'p-mute',color:'var(--text-3)'},
  UNASSIGNED:{label:'Spare',cls:'p-mute',color:'var(--mute)'},
};
function resolveStatus(aid,ds){
  const sched=scheduleFor(aid,ds);
  if(sched.exception){
    const k=sched.exception;
    return {key:STATUS[k]?k:'LEAVE', sched, lateMin:0, cs:clockState(aid,ds)};
  }
  if(!sched.segments.length) return {key:'UNASSIGNED', sched, lateMin:0, cs:clockState(aid,ds)};
  const cs=clockState(aid,ds), start=sched.segments[0].start, since=nowMin()-start;
  if(cs.inAt){
    const d=new Date(cs.inAt);
    const lateMin=Math.max(0,(d.getHours()*60+d.getMinutes())-start-SETTINGS.grace);
    if(cs.outAt) return {key:'DONE',sched,lateMin,cs};
    if(cs.onBreak) return {key:'BREAK',sched,lateMin,cs};
    return {key:lateMin>0?'LATE':'IN',sched,lateMin,cs};
  }
  if(since<0) return {key:'PENDING',sched,lateMin:0,cs};
  if(since>=SETTINGS.absent) return {key:'ABSENT',sched,lateMin:0,cs};
  if(since>=SETTINGS.mia) return {key:'MIA',sched,lateMin:0,cs};
  return {key:'LATE',sched,lateMin:Math.max(0,since-SETTINGS.grace),cs};
}

/* ---------------------------------------------------------------
   7. COVERAGE
   --------------------------------------------------------------- */
function inWindowNow(start,end,now){
  if(end<=1440) return now>=start&&now<=end;
  return now>=start||now<=(end-1440);
}
function coverage(ds){
  const now=nowMin(), sched=buildSchedule(ds);
  return D().campaigns.map(c=>{
    const w=winOf(c);
    const row={c, required:requiredFor(c.id,ds), scheduled:0, actual:0, agents:[],
               window:w, live:inWindowNow(w[0],w[1],now),
               gap:(sched.gaps.find(g=>g.campaignId===c.id)||null)};
    D().agents.forEach(a=>{
      const st=resolveStatus(a.id,ds);
      if(st.sched.exception) return;
      st.sched.segments.forEach(seg=>{
        if(seg.campaignId!==c.id) return;
        row.scheduled+=seg.fte;
        const working=['IN','LATE','BREAK'].includes(st.key);
        const counts=working&&inWindowNow(seg.start,seg.end,now);
        if(counts) row.actual+=seg.fte;
        row.agents.push({a,seg,st,counts});
      });
    });
    row.balance=row.actual-row.required;
    return row;
  });
}

/* ---------------------------------------------------------------
   8b. XLSX AND JPEG WRITERS
   A spreadsheet is a zip of XML files. This writes one directly — no
   library, nothing to load from the internet, works offline.
   --------------------------------------------------------------- */
const _crcTable=(function(){const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=_crcTable[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
const _enc=new TextEncoder();

// Store-only ZIP (no compression) — simple, and spreadsheet apps read it fine.
function zipFiles(files){
  const chunks=[], central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255];
  const u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const name=_enc.encode(f.name), data=_enc.encode(f.data), crc=crc32(data);
    const local=[].concat([0x50,0x4b,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    chunks.push(new Uint8Array(local), name, data);
    central.push({name, crc, size:data.length, offset});
    offset += local.length + name.length + data.length;
  });
  const cenStart=offset; const cen=[];
  central.forEach(c=>{
    const h=[].concat([0x50,0x4b,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(c.crc),u32(c.size),u32(c.size),u16(c.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.offset));
    cen.push(new Uint8Array(h), c.name); offset += h.length + c.name.length;
  });
  const end=new Uint8Array([].concat([0x50,0x4b,0x05,0x06],u16(0),u16(0),
    u16(central.length),u16(central.length),u32(offset-cenStart),u32(cenStart),u16(0)));
  const all=[...chunks,...cen,end];
  let total=0; all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total); let o=0; all.forEach(a=>{out.set(a,o);o+=a.length;});
  return out;
}
const xmlEsc = v => String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;').replace(/\n/g,'&#10;');
const colName = n => { let s2=''; n++; while(n>0){ const m=(n-1)%26; s2=String.fromCharCode(65+m)+s2; n=(n-m-1)/26; } return s2; };

/* rows: array of arrays. A cell is a string/number, or {v, wrap:true, bold:true}. */

/* Draws the same table onto a canvas and saves it as a JPEG. */
function downloadJPEG(filename, title, subtitle, headers, rows, widths){
  const S=2, PAD=14, LH=19, HEADH=34;
  const W=widths.reduce((a,b)=>a+b,0)+PAD*2;
  const heights=rows.map(r=>{
    let lines=1; r.forEach(c=>{ const v=(c&&c.v!=null)?c.v:c; if(typeof v==='string') lines=Math.max(lines,v.split('\n').length); });
    return Math.max(32, lines*LH+14);
  });
  const H = PAD*2 + 58 + HEADH + heights.reduce((a,b)=>a+b,0) + 26;
  const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
  const g=cv.getContext('2d'); g.scale(S,S);
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  g.textBaseline='top';
  g.fillStyle='#14161a'; g.font='600 19px Inter, Segoe UI, Arial'; g.fillText(title, PAD, PAD);
  g.fillStyle='#5b6270'; g.font='13px Inter, Segoe UI, Arial'; g.fillText(subtitle, PAD, PAD+26);

  let y=PAD+58;
  g.fillStyle='#eff1f5'; g.fillRect(PAD,y,W-PAD*2,HEADH);
  g.fillStyle='#5b6270'; g.font='600 11px Inter, Segoe UI, Arial';
  let x=PAD;
  headers.forEach((h,i)=>{ g.fillText(String(h).toUpperCase(), x+9, y+12); x+=widths[i]; });
  y+=HEADH;

  rows.forEach((r,ri)=>{
    const h=heights[ri];
    if(ri%2) { g.fillStyle='#fafbfc'; g.fillRect(PAD,y,W-PAD*2,h); }
    g.strokeStyle='#e4e7eb'; g.lineWidth=1;
    g.beginPath(); g.moveTo(PAD,y+h-0.5); g.lineTo(W-PAD,y+h-0.5); g.stroke();
    x=PAD;
    r.forEach((cell,ci)=>{
      const o=(cell&&typeof cell==='object')?cell:{v:cell};
      g.fillStyle=o.muted?'#5b6270':'#14161a';
      g.font=(o.bold?'600 ':'')+'13px Inter, Segoe UI, Arial';
      String(o.v==null?'':o.v).split('\n').forEach((ln,li)=>g.fillText(ln, x+9, y+9+li*LH));
      x+=widths[ci];
    });
    y+=h;
  });
  g.fillStyle='#878f9c'; g.font='11px Inter, Segoe UI, Arial';
  g.fillText('Pulse · generated '+new Date().toLocaleString(), PAD, y+8);

  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=el('a',{href:url,download:filename}); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  },'image/jpeg',0.93);
}

/* ---------------------------------------------------------------
   8c. SCHEDULE PREVIEW DATA — one source for the table and both exports
   --------------------------------------------------------------- */
function previewGroups(ds, groupBy){
  const sched=buildSchedule(ds);
  const fmtSeg=(seg, mode, ag)=>{
    const c=cinfo(seg);
    const when=hhmm(seg.start)+' to '+hhmm(seg.end);
    if(mode==='campaign') return when+'\n'+ag.name+' | TL: '+seg.tl;
    if(mode==='tl')       return when+'\n'+ag.name+' — '+c.name;
    return when+'\n'+c.name+' | TL: '+seg.tl;
  };
  const groups=[];

  if(groupBy==='agent'){
    rosterFor(ds).forEach(a=>{
      const sc=sched.assignments[a.id]||{segments:[]};
      const segs=segsOf(sc);
      groups.push({key:a.id, title:a.name, sub:a.unit+' · '+a.band+' band · '+a.skill,
        note:sc.note, exception:sc.exception,
        cell: sc.exception ? STATUS[sc.exception].label
             : segs.length ? segs.map(sg=>fmtSeg(sg,'agent',a)).join('\n\n')
             : 'Spare capacity',
        segments:segs, mandays:segs.reduce((n,x)=>n+x.fte,0), agentId:a.id});
    });
    return groups;
  }

  // campaign or TL
  const bucket={};
  rosterFor(ds).forEach(a=>{
    segsOf(sched.assignments[a.id]).forEach(sg=>{
      const k = groupBy==='campaign' ? sg.campaignId : (sg.tl||'—');
      bucket[k]=bucket[k]||[];
      bucket[k].push({seg:sg, a});
    });
  });
  Object.keys(bucket).sort((x,y)=>{
    const nx = groupBy==='campaign' ? (cinfo({campaignId:x,cname:(bucket[x][0].seg.cname)}).name) : x;
    const ny = groupBy==='campaign' ? (cinfo({campaignId:y,cname:(bucket[y][0].seg.cname)}).name) : y;
    return String(nx).localeCompare(String(ny));
  }).forEach(k=>{
    const items=bucket[k].sort((p,q)=>p.seg.start-q.seg.start);
    const first=items[0].seg, c=cinfo(first);
    groups.push({key:k,
      title: groupBy==='campaign' ? c.name : 'TL: '+k,
      sub: groupBy==='campaign'
        ? c.client+' · '+c.type+' · TL: '+c.tl+' · '+hhmm(winOfId(k)?winOfId(k)[0]:first.start)
        : items.length+' assignment'+(items.length===1?'':'s'),
      cell: items.map(it=>fmtSeg(it.seg, groupBy, it.a)).join('\n\n'),
      segments: items.map(it=>it.seg),
      mandays: items.reduce((n,it)=>n+it.seg.fte,0)});
  });

  if(groupBy==='campaign'){
    // campaigns that were asked for but got nobody
    D().campaigns.forEach(c=>{
      if(bucket[c.id]) return;
      if(requiredFor(c.id,ds)<=0) return;
      groups.push({key:c.id, title:c.name, sub:c.client+' · '+c.type+' · TL: '+c.tl,
        cell:'Nobody assigned', segments:[], mandays:0, empty:true});
    });
  }
  return groups;
}

/* ---------------------------------------------------------------
   8d. GOOGLE SHEET SYNC
   Pulls only when you press Sync. Three sources — campaigns, mandays,
   roster & leave — each with its own saved link.

   The sheet has to be readable without signing in: either
   File > Share > "Anyone with the link", or File > Share > Publish to web.
   If your organisation blocks both, paste or upload the CSV instead.
   --------------------------------------------------------------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    } else if(ch==='"') q=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch;
  }
  row.push(cur); rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

// Turn whatever link they paste into something fetchable.
function sheetCsvUrl(raw){
  const u=String(raw||'').trim();
  if(!u) return null;
  if(/output=csv/.test(u)) return u;                       // already a published CSV link
  const id=(u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/)||[])[1];
  if(!id) return u;
  const gid=(u.match(/[#&?]gid=([0-9]+)/)||[])[1]||'0';
  return 'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&gid='+gid;
}

const norm = v => String(v==null?'':v).trim();
const key  = v => norm(v).toLowerCase().replace(/\s+/g,' ');

/* ---- reading the real sheets -------------------------------------------
   The live sheets are not a tidy template. The campaign grid has ten
   summary rows above the header, the campaign name sits in column C, and
   the date headers are written "02-Dec" with no year. All of that is
   handled here rather than being asked of whoever maintains the sheet. */

function findCol(head, aliases){
  for(const a of aliases){
    const i=head.findIndex(h=>key(h)===key(a));
    if(i>=0) return i;
  }
  return -1;
}
// The header row is the first one carrying at least two known labels.
function findHeaderRow(rows, labels, limit){
  let best=-1, bestScore=1;
  for(let i=0;i<Math.min(rows.length, limit||25);i++){
    const score=rows[i].filter(c=>labels.some(l=>key(l)===key(c))).length;
    if(score>bestScore){ bestScore=score; best=i; }
  }
  return best;
}

const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
// Returns {m,d,y?} or null. Handles 02-Dec, Dec 9, 19-Aug-24, 2026-10-19,
// 19/10, and "Monday, July 1, 2026".
function parseDateParts(v){
  const t=norm(v); if(!t||/^ph$/i.test(t)) return null;
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return {y:+m[1], m:+m[2], d:+m[3]};
  m=t.match(/^(\d{1,2})[-\s]([a-z]{3})[a-z]*(?:[-\s](\d{2,4}))?$/i);
  if(m&&MONTHS[m[2].toLowerCase()]) return {d:+m[1], m:MONTHS[m[2].toLowerCase()],
    y:m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):null};
  m=t.match(/^([a-z]{3})[a-z]*[\s.]+(\d{1,2})(?:,?\s*(\d{4}))?$/i);
  if(m&&MONTHS[m[1].toLowerCase()]) return {d:+m[2], m:MONTHS[m[1].toLowerCase()], y:m[3]?+m[3]:null};
  m=t.match(/^[a-z]+,\s*([a-z]{3})[a-z]*\s+(\d{1,2}),\s*(\d{4})$/i);
  if(m&&MONTHS[m[1].toLowerCase()]) return {d:+m[2], m:MONTHS[m[1].toLowerCase()], y:+m[3]};
  m=t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m) return {d:+m[1], m:+m[2], y:m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):null};
  return null;
}
/* Date headers in these sheets have no year, and a run of columns can roll
   over into January. Walk left to right and bump the year when the month
   goes backwards. */
function resolveDateCols(head, yearHint){
  const out=[]; let year=yearHint||new Date().getFullYear(), last=null;
  head.forEach((h,i)=>{
    const p=parseDateParts(h); if(!p) return;
    if(p.y) year=p.y;
    else if(last!=null && p.m<last) year++;
    last=p.m;
    out.push({i, ds:year+'-'+pad(p.m)+'-'+pad(p.d), label:norm(h)});
  });
  return out;
}

// Mandays cells: a number, or one of the codes the team writes in the grid.
const MANDAY_CODES={'ib':0,'ph':0,'pause':0,'paused':0,'holiday':0,'no list':0,'sms':0,'tl':0,'ot':0};
const SKIP_CELL={'-':1,'':1,'tbc':1,'#ref!':1,'n/a':1};
function readManday(raw){
  const t=norm(raw), k=key(t);
  if(SKIP_CELL[k]) return {skip:true};
  const n=Number(t.replace(/,/g,''));
  if(t!=='' && !isNaN(n)) return {v:n};
  if(k in MANDAY_CODES) return {v:MANDAY_CODES[k], code:t};
  return {unknown:t};
}

  '':'','working':'','work':'','1':'','1.0':'','yes':'','in':'','0.75':'','0.63':'','0.625':'','0.25':'',
  'free incall':'','rdot cms only':'','sog':'','lockly':'','frannet':'',
  'leave':'LEAVE','vl':'LEAVE','sl':'LEAVE','on leave':'LEAVE',
  'forced leave':'FORCED_LEAVE','fl':'FORCED_LEAVE',
  'awol':'AWOL','absent':'AWOL','no show':'AWOL',
  'half day':'HALF_AM','half am':'HALF_AM','am':'HALF_AM','half day am':'HALF_AM','0.5':'HALF_AM','.5':'HALF_AM',
  'half pm':'HALF_PM','pm':'HALF_PM','half day pm':'HALF_PM',
  'off':'OFF','rest day':'OFF','rd':'OFF',
  'training':'TRAINING','trn':'TRAINING',
  'holiday':'HOLIDAY','ph':'HOLIDAY','ph holiday':'HOLIDAY'
};

// Campaign names carry their region: "ZYCUS TECHWATCH ANZ 18 AUG".
function regionFromName(name){
  const t=' '+key(name)+' ';
  if(/\b(na|north america|usa|us)\b/.test(t)) return 'NA';
  if(/\b(eu|emea|europe)\b/.test(t)) return 'EU';
  if(/\bmea\b/.test(t)) return 'MEA';
  if(/\b(anz|au|australia)\b/.test(t)) return 'AU';
  if(/\bapac\b/.test(t)) return 'APAC';
  return 'SEA';
}
const TYPE_MAP={'lq':'LQ','rsvp':'RSVP','cs':'CS','dp':'DP','research':'Research',
  'non-voice':'Non-Voice','non voice':'Non-Voice','f2f':'F2F','webinar':'Webinar','chat':'Non-Voice'};
const STATUS_MAP={'ongoing':'Ongoing','upcoming':'Upcoming','ending':'Ending','paused':'Paused',
  'pause':'Paused','completed':'Completed','complete':'Completed','done':'Completed'};

/* Reads a parsed sheet and reports what it WOULD change. Nothing is written
   until the user presses Apply. */
const CAMP_LABELS=['Campaign','Client','Status','PIC','Project Code','Type','Start Date','End Date','TL','Mandays'];
const ROSTER_LABELS=['Agent','Agent Name','SOURCE','Batch','Priority','Type','Unit','Class','Skill','Band'];

function planSheetImport(kind, rows, opts){
  opts=opts||{};
  const plan={kind, creates:[], updates:[], notes:[], cells:0, apply:null, error:null};
  if(!rows||rows.length<2){ plan.error='That sheet looks empty — I need a header row and at least one row of data.'; return plan; }

  const labels = kind==='roster' ? ROSTER_LABELS : CAMP_LABELS;
  const hi = findHeaderRow(rows, labels);
  if(hi<0){ plan.error='I could not find a header row. I look for a row containing '
      +labels.slice(0,5).join(', ')+' — check you linked the right tab.'; return plan; }
  const head=rows[hi].map(norm), body=rows.slice(hi+1);
  const dateCols=resolveDateCols(head, opts.year);
  plan.notes.push('Header found on row '+(hi+1)+'; '+dateCols.length+' date column(s).');

  if(kind==='campaigns'){
    const ci={
      name:findCol(head,['Campaign','Campaign Name']),
      client:findCol(head,['Client']),
      status:findCol(head,['Status']),
      tl:findCol(head,['TL','PIC','Team Leader']),
      type:findCol(head,['Type']),
      mandays:findCol(head,['Mandays','Default mandays']),
      region:findCol(head,['Region']),
      start:findCol(head,['Shift start','Start time','Shift Start Time']),
      block:findCol(head,['Stint','Stint length','Block'])
    };
    if(ci.name<0){ plan.error='No "Campaign" column in the header row.'; return plan; }
    const incoming=[];
    body.forEach(r=>{
      const name=norm(r[ci.name]);
      if(!name || /^(required|available|balance|incall only|fervent|grand total|total)$/i.test(name)) return;
      const o={name};
      if(ci.client>=0&&norm(r[ci.client])) o.client=/ferv/i.test(r[ci.client])?'Fervent':'Incall';
      if(ci.status>=0&&norm(r[ci.status])) o.status=STATUS_MAP[key(r[ci.status])]||'Ongoing';
      if(ci.tl>=0&&norm(r[ci.tl])&&!/^(tbc|-)$/i.test(norm(r[ci.tl]))) o.tl=norm(r[ci.tl]).split('/')[0].trim();
      if(ci.type>=0&&norm(r[ci.type])) o.type=TYPE_MAP[key(r[ci.type])]||'LQ';
      if(ci.mandays>=0&&norm(r[ci.mandays])!==''){ const m=readManday(r[ci.mandays]); if(m.v!=null) o.mandays=m.v; }
      if(ci.region>=0&&norm(r[ci.region])) o.region=norm(r[ci.region]).toUpperCase();
      if(ci.start>=0){ const t=parseTime(r[ci.start]); if(t!=null) o.start=t; }
      if(ci.block>=0&&norm(r[ci.block])){ const bk=key(r[ci.block]);
        o.block=bk.startsWith('full')?'full':(bk.match(/\d+/)||['full'])[0]; }
      if(!o.region) o.region=regionFromName(name);
      if(o.start==null) o.start=(REGION_WINDOW[o.region]||REGION_WINDOW.SEA)[0];
      incoming.push(o);
    });
    if(!incoming.length){ plan.error='Found the header but no campaign rows under it.'; return plan; }
    incoming.forEach(o=>{
      const ex=D().campaigns.find(c=>key(c.name)===key(o.name));
      if(ex){ const diffs=Object.keys(o).filter(k2=>k2!=='name'&&String(ex[k2])!==String(o[k2]));
        if(diffs.length) plan.updates.push({name:o.name, fields:diffs}); }
      else plan.creates.push({name:o.name});
    });
    if(ci.region<0) plan.notes.push('No Region column, so the region was read from each campaign name (ANZ, MEA, EU, NA…), defaulting to SEA. The shift start follows the region and is editable on the Campaigns tab.');
    if(ci.start<0) plan.notes.push('No shift-start column — "Start Date" is the campaign’s first day, not a shift time, so it was ignored.');
    const missing=D().campaigns.filter(c=>!incoming.some(o=>key(o.name)===key(c.name)));
    if(missing.length) plan.notes.push(missing.length+' campaign(s) in the app are not in the sheet. They are left alone, never deleted.');
    plan.apply=()=>touched(d=>{
      incoming.forEach(o=>{
        const ex=d.campaigns.find(c=>key(c.name)===key(o.name));
        if(ex) Object.assign(ex,o);
        else d.campaigns.push(Object.assign({id:uid('c'),client:'Incall',type:'LQ',region:'SEA',
          tl:'TBC',status:'Ongoing',mandays:1,block:'full',start:REGION_WINDOW.SEA[0]}, o));
      });
    });
    return plan;
  }

  if(kind==='mandays'){
    const nameCol=findCol(head,['Campaign','Campaign Name']);
    if(nameCol<0){ plan.error='No "Campaign" column in the header row.'; return plan; }
    if(!dateCols.length){ plan.error='No date columns found in the header row. I read 02-Dec, 19-Aug-24, 2026-10-19, 19/10 and Dec 9. Columns headed "PH" are treated as holidays, not dates.'; return plan; }
    const set=[], unknownCamps=[], oddCells=[];
    body.forEach(r=>{
      const name=norm(r[nameCol]);
      if(!name || /^(required|available|balance|incall only|fervent|grand total|total)$/i.test(name)) return;
      const c=D().campaigns.find(x=>key(x.name)===key(name));
      if(!c){ if(!unknownCamps.includes(name)) unknownCamps.push(name); return; }
      dateCols.forEach(dc=>{
        const cell=readManday(r[dc.i]);
        if(cell.skip) return;
        if(cell.unknown!=null){ if(oddCells.length<6&&!oddCells.includes(cell.unknown)) oddCells.push(cell.unknown); return; }
        set.push({cid:c.id, ds:dc.ds, v:cell.v});
      });
    });
    plan.cells=set.length;
    const dates=[...new Set(set.map(x=>x.ds))].sort();
    const lockedHit=[...new Set(set.filter(x=>lockedDay(x.ds)).map(x=>x.ds))];
    if(dates.length) plan.notes.push('Dates read: '+dates[0]+' to '+dates[dates.length-1]
      +'. The headers carry no year, so '+(opts.year||new Date().getFullYear())+' was assumed — change it above if that is wrong.');
    if(lockedHit.length) plan.notes.push(lockedHit.length+' locked date(s) will be skipped.');
    if(unknownCamps.length) plan.notes.push('No campaign in the app matches: '+unknownCamps.slice(0,8).join(', ')
      +(unknownCamps.length>8?' and '+(unknownCamps.length-8)+' more':'')+'. Sync the campaign list first.');
    if(oddCells.length) plan.notes.push('Ignored cells that are neither a number nor a known code: '+oddCells.join(', ')
      +'. IB, PH, Pause, TL, OT, Holiday, SMS and No List are read as zero.');
    if(!set.length){ plan.error='Found '+dateCols.length+' date column(s) but no usable values. Most likely the campaign names do not match the app yet — sync the campaign list first.'; return plan; }
    plan.updates=[{name:set.length+' manday value(s) across '+dates.length+' date(s)', fields:[]}];
    plan.apply=()=>touched(d=>{
      d.required=d.required||{};
      set.forEach(x=>{ if(lockedDay(x.ds)) return;
        d.required[x.cid]=d.required[x.cid]||{}; d.required[x.cid][x.ds]=x.v; });
    });
    return plan;
  }

  if(kind==='roster'){
    const nameCol=findCol(head,['Agent','Agent Name','Name']);
    if(nameCol<0){ plan.error='No "Agent" column in the header row.'; return plan; }
    const ci={unit:findCol(head,['Unit','Priority']), cls:findCol(head,['Class','Batch']),
      skill:findCol(head,['Skill','Type']), band:findCol(head,['Band','Shift band']),
      active:findCol(head,['Active'])};
    const incoming=[], leave=[], odd=[];
    body.forEach(r=>{
      const name=norm(r[nameCol]);
      if(!name || /^(x|incall agents|fervent agents|total|agent)$/i.test(name)) return;
      const o={name};
      if(ci.unit>=0&&norm(r[ci.unit])) o.unit=/ferv/i.test(r[ci.unit])?'Fervent':'Incall';
      if(ci.cls>=0&&norm(r[ci.cls])){ const k2=key(r[ci.cls]);
        o.cls = k2.includes('senior')?'Senior':k2.includes('train')?'Trainee':k2.includes('free')?'Freelancer':'Temp'; }
      if(ci.skill>=0&&norm(r[ci.skill])) o.skill=TYPE_MAP[key(r[ci.skill])]||'LQ';
      if(ci.band>=0&&norm(r[ci.band])) o.band=key(r[ci.band]);
      if(ci.active>=0&&norm(r[ci.active])) o.active=!/^(no|false|0|inactive)$/i.test(norm(r[ci.active]));
      incoming.push(o);
      dateCols.forEach(dc=>{
        const raw=norm(r[dc.i]); if(raw==='') return;
        const k2=key(raw);
        if(!(k2 in LEAVE_WORDS)){ if(odd.length<6&&!odd.includes(raw)) odd.push(raw); return; }
        leave.push({name, ds:dc.ds, code:LEAVE_WORDS[k2]});
      });
    });
    if(!incoming.length){ plan.error='Found the header but no agent rows under it.'; return plan; }
    incoming.forEach(o=>{
      const ex=D().agents.find(a=>key(a.name)===key(o.name));
      if(ex){ const diffs=Object.keys(o).filter(k2=>k2!=='name'&&String(ex[k2])!==String(o[k2]));
        if(diffs.length) plan.updates.push({name:o.name, fields:diffs}); }
      else plan.creates.push({name:o.name});
    });
    plan.cells=leave.length;
    const dates=[...new Set(leave.map(x=>x.ds))].sort();
    if(leave.length) plan.updates.push({name:leave.length+' leave entr(y/ies) across '+dates.length+' date(s)', fields:[]});
    if(dates.length) plan.notes.push('Leave dates read: '+dates[0]+' to '+dates[dates.length-1]
      +' (year assumed '+(opts.year||new Date().getFullYear())+').');
    if(ci.band<0) plan.notes.push('No Band column, so existing agents keep their shift band and new ones start on day band. Set night band for the NA team on the Roster list.');
    if(odd.length) plan.notes.push('Ignored values I did not recognise: '+odd.join(', ')
      +'. 1, 0.75 and account names are treated as working; 0.5 is a half day.');
    const missing=D().agents.filter(a=>!incoming.some(o=>key(o.name)===key(a.name)));
    if(missing.length) plan.notes.push(missing.length+' agent(s) in the app are not in the sheet. Left alone, never removed.');
    plan.apply=()=>touched(d=>{
      incoming.forEach(o=>{
        const ex=d.agents.find(a=>key(a.name)===key(o.name));
        if(ex) Object.assign(ex,o);
        else d.agents.push(Object.assign({id:uid('a'),unit:'Incall',cls:'Temp',skill:'LQ',band:'day',active:true}, o));
      });
      d.exceptions=d.exceptions||{};
      leave.forEach(x=>{
        if(lockedDay(x.ds)) return;
        const a=d.agents.find(y=>key(y.name)===key(x.name)); if(!a) return;
        if(x.code==='') delete d.exceptions[a.id+'|'+x.ds];
        else d.exceptions[a.id+'|'+x.ds]=x.code;
      });
    });
    return plan;
  }
  plan.error='Unknown import type.';
  return plan;
}

const SHEET_INFO={
  campaigns:{title:'Campaign list',
    cols:'Campaign · Client · Status · PIC or TL · Type',
    hint:'Your CAMPAIGNS tab works as it is. The header row is found wherever it sits, so the REQUIRED / AVAILABLE / BALANCE rows above it are ignored, and PIC is read as the TL. Region comes from the campaign name (ANZ, MEA, EU, NA) unless there is a Region column. Start Date is the campaign\u2019s first day, not a shift time, so it is ignored — set shift start times on the Campaigns tab.'},
  mandays:{title:'Mandays per day',
    cols:'Campaign · then one column per date',
    hint:'The same CAMPAIGNS tab. Each date column is read as that campaign\u2019s mandays for the day. IB, PH, Pause, TL, OT, Holiday, SMS and No List count as zero; a name written in a cell is ignored. Headers like 02-Dec have no year, so set the year below.'},
  roster:{title:'Roster & leave',
    cols:'Agent · Priority or Unit · Batch or Class · Type or Skill · then one column per date',
    hint:'Your Manpower tab works as it is. 1 and 0.75 mean working, 0.5 is a half day, and LEAVE, FL, OFF, ABSENT and PH Holiday are read as leave, forced leave, rest day, AWOL and holiday. Headers with no year use the year set below.'}
};

function openSheetSync(kind){
  const info=SHEET_INFO[kind];
  const saved=((D().settings||{}).sheets||{})[kind]||'';
  const urlIn=el('input',{class:'input',placeholder:'https://docs.google.com/spreadsheets/d/...',value:saved});
  const thisYear=new Date().getFullYear();
  const yearIn=el('select',{class:'input',style:'width:auto'},
    [thisYear-1,thisYear,thisYear+1].map(y=>el('option',{value:String(y),selected:y===thisYear?'':null},String(y))));
  const opts=()=>({year:Number(yearIn.value)});
  const paste=el('textarea',{class:'input',rows:'4',placeholder:'…or paste the sheet contents here (copy the cells straight out of Google Sheets)'});
  const file=el('input',{type:'file',accept:'.csv,.tsv,.txt',class:'input'});
  const status=el('div',{class:'tiny',style:'margin-top:8px'});
  const result=el('div',{style:'margin-top:14px'});

  function show(plan){
    result.innerHTML='';
    if(plan.error){ result.appendChild(el('div',{class:'err'},plan.error)); return; }
    const n=plan.creates.length+plan.updates.length;
    if(!n){ result.appendChild(el('div',{class:'banner'},el('span',{},'✓'),el('span',{},'Nothing to change — the app already matches the sheet.'))); return; }
    const box=el('div',{class:'card',style:'background:var(--bg-sunk)'});
    const body=el('div',{class:'card-body'});
    body.appendChild(el('h3',{style:'margin-bottom:8px'},'This is what the sync would do'));
    if(plan.creates.length) body.appendChild(el('p',{class:'sub'},
      el('strong',{},'Add '+plan.creates.length+': '), plan.creates.slice(0,12).map(c=>c.name).join(', ')+(plan.creates.length>12?'…':'')));
    if(plan.updates.length) body.appendChild(el('p',{class:'sub',style:'margin-top:6px'},
      el('strong',{},'Update: '), plan.updates.slice(0,12).map(u=>u.name+(u.fields.length?' ('+u.fields.join(', ')+')':'')).join('; ')+(plan.updates.length>12?'…':'')));
    plan.notes.forEach(t=>body.appendChild(el('p',{class:'tiny',style:'margin-top:8px'},'· '+t)));
    body.appendChild(el('button',{class:'btn btn-primary',style:'margin-top:14px',onclick:()=>{
      plan.apply();
      if(urlIn.value.trim()){
        const sh=Object.assign({},(D().settings||{}).sheets||{}); sh[kind]=urlIn.value.trim();
        setSetting('sheets',sh);
      }
      closeModal();
    }},'Apply '+n+' change'+(n===1?'':'s')));
    box.appendChild(body); result.appendChild(box);
  }
  const handle=text=>{
    const rows=parseCSV(text.indexOf('\t')>-1 && text.indexOf(',')===-1 ? text.replace(/\t/g,',') : text);
    status.textContent='Read '+rows.length+' row(s) from the sheet.';
    show(planSheetImport(kind, rows, opts()));
  };

  file.addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>handle(String(r.result)); r.readAsText(f); });

  const body=el('div',{},
    el('p',{class:'sub',style:'margin-bottom:12px'},
      'Pulls only when you press Sync. Nothing is written until you have seen what would change.'),
    el('div',{class:'card',style:'background:var(--bg-sunk);margin-bottom:16px'},
      el('div',{class:'card-body',style:'padding:11px 13px'},
        el('div',{class:'tiny',style:'font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px'},'Columns this reads'),
        el('div',{style:'font-size:13px;font-weight:550;margin-bottom:5px'},info.cols),
        el('div',{class:'tiny'},info.hint))),
    el('div',{class:'field'}, el('label',{},'Google Sheet link'), urlIn),
    el('div',{style:'display:flex;gap:10px;align-items:center;margin:-4px 0 12px'},
      el('span',{class:'tiny'},'Date headers like 02-Dec have no year. Treat them as'), yearIn),
    el('p',{class:'tiny',style:'margin:-6px 0 12px'},
      'The sheet must be readable without signing in — File → Share → Anyone with the link, or File → Share → Publish to web. Copy the link of the tab you want; its gid is picked up automatically.'),
    el('button',{class:'btn btn-primary',onclick:()=>{
      const u=sheetCsvUrl(urlIn.value);
      if(!u){ status.textContent='Enter a link first.'; return; }
      status.textContent='Fetching…'; result.innerHTML='';
      const alt=(function(){
        const id=(urlIn.value.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/)||[])[1];
        const gid=(urlIn.value.match(/[#&?]gid=([0-9]+)/)||[])[1]||'0';
        return id?'https://docs.google.com/spreadsheets/d/'+id+'/export?format=csv&gid='+gid:null;
      })();
      const tryFetch=url=>fetch(url,{cache:'no-store'})
        .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); });
      tryFetch(u)
        .catch(()=>alt?tryFetch(alt):Promise.reject(new Error('no alternative URL')))
        .then(handle)
        .catch(err=>{
          status.textContent='';
          result.innerHTML='';
          result.appendChild(el('div',{class:'err'},
            'Could not read that sheet ('+err.message+'). The browser can only read a sheet that opens '
            +'without signing in, and this one does not. In Google Sheets choose File → Share → '
            +'Publish to web, pick the tab, choose CSV, and paste that link here. If your organisation '
            +'blocks publishing, select the cells in the sheet, copy them, and paste into the box below — '
            +'that always works and reads exactly the same.'));
        });
    }},'Sync now'),
    status,
    el('div',{class:'divider'},'OR WITHOUT A LINK'),
    el('div',{class:'field'}, el('label',{},'Paste the cells'), paste,
      el('button',{class:'btn btn-sm',style:'margin-top:8px',onclick:()=>{

  sc.appendChild(el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px'},

          el('div',{class:'tiny'}, c.client+' · '+c.type+' · '+c.region)),
        el('span',{class:'chip',style:'align-self:center;color:'+(TL_COLOR[s.tl]||'var(--text-2)')},'TL: '+s.tl)));

    const start=st.sched.segments[0].start, mins=nowMin()-start;

      w.appendChild(el('button',{class:'bigbtn '+(late?'late':'go'), disabled:early?'':null, onclick:()=>{
        addEvent(aid,'IN',ds);

        early?'Opens at '+hhmm(start-SETTINGS.earlyIn):'Clock In'));
      w.appendChild(el('p',{class:'tiny',style:'text-align:center;margin-top:9px'},
        mins<0?'Your shift starts in '+fmtDur(-mins):late?'You are '+fmtDur(mins)+' past your start time':'Right on time'));
    } else if(!cs.outAt){
      const worked=Math.round((Date.now()-cs.inAt-cs.breakMs)/60000);
      w.appendChild(el('div',{class:'card',style:'padding:18px;margin-bottom:12px;text-align:center'},
        el('div',{class:'tiny',style:'margin-bottom:4px'}, cs.onBreak?'On break':'Time on shift'),

        el('button',{class:'btn bigbtn stop',style:'padding:14px;font-size:15px',onclick:()=>{
          addEvent(aid,'OUT',ds);
          flashMsg='Clocked out at '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
          setTimeout(()=>{flashMsg=null;render()},4000); render();}},'Clock Out')));
    } else {
      const worked=Math.round((cs.outAt-cs.inAt-cs.breakMs)/60000);
      w.appendChild(el('div',{class:'card',style:'padding:20px;text-align:center'},
        el('div',{style:'font-size:30px;margin-bottom:6px'},'✓'), el('h2',{},'Shift complete'),

  return w;

/* ---------- coverage ---------- */
function CoverageView(){
  const ds=shiftDateFor();
  const rows=coverage(ds).sort((a,b)=>(b.live-a.live)||(a.balance-b.balance));
  const w=el('div',{});
  w.appendChild(el('div',{class:'page-head'},

    el('button',{class:'btn btn-sm',onclick:()=>exportCoverage(ds)},'Export coverage (CSV)')));

  const liveRows=rows.filter(r=>r.live);
  const tot=liveRows.reduce((o,r)=>({req:o.req+r.required,act:o.act+r.actual,sch:o.sch+r.scheduled}),{req:0,act:0,sch:0});
  const bal=tot.act-tot.req, dayTot=rows.reduce((n,r)=>n+r.required,0);
  const byUnit={}; liveRows.forEach(r=>{const k=r.c.client;byUnit[k]=byUnit[k]||{req:0,act:0};byUnit[k].req+=r.required;byUnit[k].act+=r.actual});

    el('div',{class:'roll'},el('div',{class:'k'},'Balance'),
      el('div',{class:'v bal '+(bal<0?'neg':bal>0?'pos':'zero')},(bal>0?'+':'')+fteTxt(bal)),

      el('td',{class:'tiny'}, hhmm(r.window[0])+'–'+hhmm(r.window[1]),
        !r.live&&el('div',{},el('span',{class:'pill p-mute',style:'margin-top:3px'},'Not yet due'))),
      el('td',{class:'r'}, fteTxt(r.required)),
      el('td',{class:'r muted'}, fteTxt(r.scheduled),
        r.gap?el('div',{class:'tiny',style:'color:var(--bad)'},fteTxt(r.gap.unfilled)+' unfilled'):null),
      el('td',{class:'r',style:'font-weight:650'}, r.live?fteTxt(r.actual):'—'),
      el('td',{class:'r'}, r.live?el('span',{class:'bal '+(r.balance<0?'neg':r.balance>0?'pos':'zero')},
        (r.balance>0?'+':'')+fteTxt(r.balance)):el('span',{class:'tiny'},'—')),
      el('td',{style:'min-width:110px'}, el('div',{class:'bar'},el('i',{class:cls,style:'width:'+(r.live?pct*100:0)+'%'})),
        el('div',{class:'tiny',style:'margin-top:3px'}, !r.live?'window closed':r.required?Math.round(r.actual/r.required*100)+'% covered':'no demand')),
      el('td',{}, dots)));
  });
  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'card-head'},el('h2',{},'By campaign'),el('span',{class:'tiny'},'Worst shortfall first')));
  card.appendChild(el('div',{class:'tablewrap'},el('table',{},el('thead',{},el('tr',{},
    [['Campaign',''],['Window',''],['Required','r'],['Scheduled','r'],['Actual','r'],['Balance','r'],['Coverage',''],['Who','']]
      .map(([h,c])=>el('th',{class:c},h)))),tb)));
  w.appendChild(card);

  const gaps=buildSchedule(ds).gaps;
  if(gaps.length){
    const gc=el('div',{class:'card',style:'margin-top:16px'});
    gc.appendChild(el('div',{class:'card-head'},el('h2',{},'Why some mandays could not be filled'),

    gaps.forEach(g=>gc.appendChild(el('div',{class:'exc'},
      el('span',{class:'pill p-warn'},fteTxt(g.unfilled)),
      el('div',{class:'grow'}, el('div',{class:'name'},campaign(g.campaignId).name),
        el('div',{class:'tiny'},g.reason)))));
    w.appendChild(gc);
  }
  return w;

/* ---------- reports ---------- */
function Reports(){
  const ds=shiftDateFor();
  const rows=D().agents.map(a=>({a,st:resolveStatus(a.id,ds)}));
