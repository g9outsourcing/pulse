<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Attendance</title>
<meta name="description" content="Employee attendance and clock-in board for G9 Outsourcing / NYTelecon.">
<style>
:root{
  --bg:#fff; --bg-sunk:#f6f7f9; --surface:#fff; --surface-2:#f1f3f5;
  --border:#e4e7eb; --border-strong:#d2d7dd;
  --text:#14161a; --text-2:#5b6270; --text-3:#878f9c;
  --accent:#3b5bdb; --accent-soft:#eaeeff; --on-accent:#fff;
  --ok:#1a7f52; --ok-soft:#e6f4ed;
  --warn:#9a6212; --warn-soft:#fdf2e0;
  --bad:#b3261e; --bad-soft:#fdeceb;
  --info:#1f6f9c; --info-soft:#e7f2f8;
  --mute:#6b7280; --mute-soft:#f0f1f3;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(16,18,22,.05), 0 8px 24px rgba(16,18,22,.06);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --bg-sunk:#0a0b0e; --surface:#16191e; --surface-2:#1d2026;
  --border:#272b33; --border-strong:#353a44;
  --text:#eef0f3; --text-2:#a3abb8; --text-3:#767e8b;
  --accent:#748ffc; --accent-soft:#1c2338; --on-accent:#0e1013;
  --ok:#4ec08a; --ok-soft:#10261c; --warn:#e3b341; --warn-soft:#2a2113;
  --bad:#f28b82; --bad-soft:#2d1614; --info:#6fb6dd; --info-soft:#11232e;
  --mute:#9aa2ae; --mute-soft:#1d2026;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0e1013; --bg-sunk:#0a0b0e; --surface:#16191e; --surface-2:#1d2026;
  --border:#272b33; --border-strong:#353a44;
  --text:#eef0f3; --text-2:#a3abb8; --text-3:#767e8b;
  --accent:#748ffc; --accent-soft:#1c2338; --on-accent:#0e1013;
  --ok:#4ec08a; --ok-soft:#10261c; --warn:#e3b341; --warn-soft:#2a2113;
  --bad:#f28b82; --bad-soft:#2d1614; --info:#6fb6dd; --info-soft:#11232e;
  --mute:#9aa2ae; --mute-soft:#1d2026;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
.hide{display:none !important}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:0 16px;height:60px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:7px 13px;border-radius:999px;color:var(--text-2);font-size:14px;font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.clock{font-size:14px;color:var(--text-2);font-weight:500;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--border)}
.who:hover{background:var(--surface-2)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);
  color:var(--accent);font-size:11px;font-weight:700;flex:none}
.main{padding:22px 16px 80px;max-width:1500px;margin:0 auto}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600}
.sub{color:var(--text-2);font-size:14px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-body{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:500;transition:background .12s}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-danger{color:var(--bad);border-color:var(--border-strong)}
.btn-sm{padding:5px 10px;font-size:13px}
.input,select.input{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface)}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap}
.pill .sq{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--mute-soft);color:var(--mute)} .p-accent{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;background:var(--surface-2);
  color:var(--text-2);font-size:11.5px;font-weight:600;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;text-align:left}
.stat:hover{border-color:var(--border-strong)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat .v{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.stat .l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);font-weight:500;margin-top:3px}
.stat .l .sq{width:8px;height:8px;border-radius:2px;flex:none}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:2}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-sunk)}
.r{text-align:right} .c{text-align:center}
.name{font-weight:550} .muted{color:var(--text-2)} .tiny{font-size:12px;color:var(--text-3)}
.bar{position:relative;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;display:block}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.over{background:var(--info)}
.bal{font-weight:650} .bal.neg{color:var(--bad)} .bal.pos{color:var(--info)} .bal.zero{color:var(--text-2)}
.rollups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.roll{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg-sunk)}
.roll .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600}
.roll .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.ribbon{display:flex;height:7px;border-radius:999px;overflow:hidden;background:var(--surface-2);min-width:90px}
.ribbon span{display:block;height:100%}
.dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}
.agentwrap{max-width:560px;margin:0 auto}
.hero{text-align:center;padding:10px 0 22px}
.hero .hi{font-size:15px;color:var(--text-2)}
.hero .now{font-size:46px;font-weight:650;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.hero .date{font-size:13.5px;color:var(--text-3);margin-top:2px}
.schedcard{padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);margin-bottom:14px}
.seg{display:flex;gap:12px;padding:11px 0;border-top:1px dashed var(--border)}
.seg:first-of-type{border-top:none;padding-top:4px}
.seg .time{font-weight:600;white-space:nowrap;font-size:14px}
.bigbtn{width:100%;padding:20px;border-radius:var(--radius);font-size:19px;font-weight:650;letter-spacing:-.01em;border:1px solid transparent;transition:transform .08s}
.bigbtn:active{transform:scale(.985)}
.bigbtn.go{background:var(--ok);color:#fff}
.bigbtn.late{background:#f0a429;color:#3a2600}
.bigbtn.stop{background:var(--surface);border-color:var(--border-strong)}
.bigbtn[disabled]{opacity:.55;cursor:not-allowed}
.timer{font-size:40px;font-weight:650;letter-spacing:-.03em;text-align:center;line-height:1.1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flash{background:var(--ok-soft);color:var(--ok);border-radius:var(--radius);padding:13px 15px;font-weight:600;
  text-align:center;margin-bottom:12px;animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.loginwrap{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg-sunk)}
.loginbox{width:100%;max-width:400px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.quick{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.quick button{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;font-size:13.5px}
.quick button:hover{background:var(--surface-2);border-color:var(--border-strong)}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--text-3);font-size:11.5px;font-weight:600;letter-spacing:.05em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty .big{font-size:34px;margin-bottom:8px}
.exc{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border)}
.exc:last-child{border-bottom:none}
.exc .grow{flex:1;min-width:0}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daycard{border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;background:var(--surface)}
.daycard.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.banner{background:var(--accent-soft);color:var(--accent);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;
  margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.subnav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);overflow-x:auto}
.subnav button{padding:9px 14px;font-size:14px;font-weight:550;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.subnav button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.gridcell{width:58px;padding:5px 6px;text-align:center;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px}
.gridcell:focus{outline:2px solid var(--accent);outline-offset:-1px}
.gridcell.dflt{color:var(--text-3)}
.gridcell.set{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
.sticky-first td:first-child,.sticky-first th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.sticky-first tbody tr:hover td:first-child{background:var(--bg-sunk)}
.tl{position:relative;height:9px;border-radius:999px;background:var(--surface-2);margin-top:8px;min-width:150px}
.tl-sm{height:7px;margin-top:4px}
.tlseg{position:absolute;top:0;bottom:0;border-radius:3px}
.tlaxis{position:relative;height:15px;margin-top:3px;font-size:10px;color:var(--text-3)}
.tlaxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.modalbg{position:fixed;inset:0;background:rgba(10,12,16,.55);display:grid;place-items:center;z-index:200;padding:20px}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal .card-head{position:sticky;top:0;background:var(--surface)}
.manual{background:var(--accent-soft);color:var(--accent);font-weight:650}
footer.note{max-width:1500px;margin:0 auto;padding:0 16px 40px;color:var(--text-3);font-size:12.5px}
@media (max-width:640px){.main{padding:16px 12px 70px}h1{font-size:22px}.hero .now{font-size:40px}.clock{display:none}}
</style>
</head>

<div id="app"></div>
<script>
/* ===========================================================================
   PULSE — Employee Attendance & Clock-In
   Single file. No build step, no server, no dependencies.

   HOW THE SCHEDULE WORKS
   ----------------------
   You do NOT write schedules by hand. You maintain two things in Admin:
     1. the campaign list, and
     2. the mandays each campaign needs per day.
   The app works out who goes where, every time it loads. Change the mandays,
   the schedule changes. Nothing else to update.
   =========================================================================== */

/* ---------------------------------------------------------------
   1. FIXED REFERENCE DATA
   --------------------------------------------------------------- */

// Shift windows, in minutes from midnight. A value over 1440 means next day.
const REGION_WINDOW = {
  AU:   [7*60,     16*60+30],   // 7:00 AM – 4:30 PM
  SEA:  [8*60+30,  18*60],      // 8:30 AM – 6:00 PM
  APAC: [8*60+30,  18*60],
  PH:   [8*60,     16*60],      // 8:00 AM – 4:00 PM
  MEA:  [12*60+30, 22*60],      // 12:30 PM – 10:00 PM
  EU:   [15*60+30, 25*60],      // 3:30 PM – 1:00 AM
  NA:   [21*60,    30*60+30],   // 9:00 PM – 6:30 AM
};
const REGIONS = Object.keys(REGION_WINDOW);
const TYPES   = ['LQ','RSVP','CS','DP','Research','Non-Voice','F2F','Webinar'];
const STATUSES= ['Ongoing','Upcoming','Ending','Paused','Completed'];
const UNITS   = ['Incall','Fervent'];
const CLASSES = ['Senior','Temp','Trainee','Freelancer'];
const BANDS   = ['day','evening','night'];

const TL_COLOR = {Cha:'#3b5bdb',Jovi:'#0b7285',Maricel:'#9c36b5',Allen:'#2b8a3e',
  Kurtnie:'#c2410c',Rizza:'#a61e4d',Christine:'#5c7cfa',Cathy:'#0ca678',TJ:'#7048e8',Tessa:'#495057'};

const SETTINGS = {grace:5, mia:30, absent:120, earlyIn:60};

// One manday = this many productive hours. Everything converts through it:
// 1 manday = 8h, 0.5 = 4h, 0.25 = 2h, 0.125 = 1h.
const WORK_HOURS = 8;
const WORK_MIN = WORK_HOURS*60;

// How long one agent's stint on a campaign lasts. 'full' = the whole shift window.
const BLOCKS = [['full','Full shift'],['4','4 hours'],['2','2 hours'],['1','1 hour']];
const blockMinutes = b => b==='full' ? null : Number(b)*60;

// Day statuses an admin or TL can set against an agent.
// The first four are the ones that stop an agent being scheduled at all.
const EXC_OPTIONS = [
  ['',             'Working (normal)'],
  ['LEAVE',        'Leave'],
  ['FORCED_LEAVE', 'Forced leave'],
  ['AWOL',         'AWOL'],
  ['HALF_AM',      'Half day — works morning'],
  ['HALF_PM',      'Half day — works afternoon'],
  ['OFF',          'Rest day'],
  ['TRAINING',     'Training'],
  ['HOLIDAY',      'Holiday'],
];
const EXC_LABEL = Object.fromEntries(EXC_OPTIONS.filter(x=>x[0]).concat([['HALF_DAY','Half day — works morning']]));
const DEMO_AGENT = 'a1';

const USERS = [
  {email:'abi@nytelecon.com',   name:'Abi Esmao',   role:'agent', agentId:'a1'},
  {email:'cha@nytelecon.com',   name:'Cha',         role:'tl'},
  {email:'jovi@nytelecon.com',  name:'Jovi',        role:'tl'},
  {email:'tessa@nytelecon.com', name:'Tessa Jacob', role:'admin'},
];

/* ---------------------------------------------------------------
   2. STARTING DATA  (replaced by data.json once you publish one)
   --------------------------------------------------------------- */
const DEFAULT_DATA = {
  meta:{updated:null, note:'Built-in starting data'},
  campaigns:[
    {id:'c1', name:'Dell RSVP',     client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:3, block:'full'},

    {id:'c5', name:'Checkpoint LQ', client:'Incall',  type:'LQ',      region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:1, block:'full'},
    {id:'c6', name:'Cohesity RSVP', client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Jovi',      status:'Ongoing', mandays:1, block:'full'},
    {id:'c7', name:'Ingram Micro',  client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Jovi',      status:'Ongoing', mandays:1, block:'full'},
    {id:'c8', name:'Fujitsu RSVP',  client:'Incall',  type:'RSVP',    region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:0.5, block:'full'},
    {id:'c9', name:'Starhub LQ',    client:'Incall',  type:'LQ',      region:'SEA',  tl:'Cha',       status:'Ongoing', mandays:1, block:'full'},
    {id:'c10',name:'SOG',           client:'Incall',  type:'CS',      region:'PH',   tl:'Christine', status:'Ongoing', mandays:1, block:'full'},

  agents:[
    {id:'a1', name:'Abi Esmao',             unit:'Incall',  cls:'Senior',     skill:'LQ',      band:'day',     active:true},

/* Locked days keep their own copy of the campaigns and roster as they were that
   day, so renaming or deleting a campaign never rewrites history. */
let _snap=null;
function snap(){
  if(_snap) return _snap;
  _snap={c:{},a:{}};
  Object.values(D().history||{}).forEach(h=>{
    Object.entries(h.campaigns||{}).forEach(([k,v])=>{ if(!_snap.c[k]) _snap.c[k]=v; });
    Object.entries(h.roster||{}).forEach(([k,v])=>{ if(!_snap.a[k]) _snap.a[k]=v; });
  });
  return _snap;
}
const campaign = id => D().campaigns.find(c=>c.id===id) || snap().c[id] || null;
const agent    = id => D().agents.find(a=>a.id===id)   || snap().a[id] || null;

const lockedDay = ds => (D().history||{})[ds] || null;
const segsOf = a => (a && a.segments) || [];

/* Campaign details for a segment. A locked segment carries its own copy, so a
   campaign renamed or deleted later never rewrites what the record says. */
function cinfo(seg){
  if(seg && seg.cname) return {id:seg.campaignId, name:seg.cname, client:seg.cclient||'',
                               type:seg.ctype||'', region:seg.cregion||'SEA', tl:seg.tl};
  const c=campaign(seg&&seg.campaignId);
  return c || {id:seg&&seg.campaignId, name:'(removed campaign)', client:'', type:'', region:'SEA', tl:seg&&seg.tl};
}
const rosterFor = ds => { const h=lockedDay(ds);
  return h&&h.roster ? Object.values(h.roster) : D().agents; };

// Mandays for a campaign on a date: the date-specific value, else the campaign default.
function requiredFor(cid, dateStr){
  const h=lockedDay(dateStr);
  if(h&&h.required&&h.required[cid]!==undefined) return Number(h.required[cid]);
  const r = D().required||{};
  if(r[cid] && r[cid][dateStr]!==undefined && r[cid][dateStr]!==null && r[cid][dateStr]!=='') return Number(r[cid][dateStr]);
  const c = campaign(cid);
  return c ? Number(c.mandays||0) : 0;
}

  const r=D().required||{};
  return !!(r[cid] && r[cid][dateStr]!==undefined && r[cid][dateStr]!==null && r[cid][dateStr]!=='');
}
function exceptionFor(aid, dateStr){
  const e=(D().exceptions||{})[aid+'|'+dateStr];
  if(e) return e;
  if(isWeekend(parseYmd(dateStr))) return 'OFF';
  return null;

/* ---------------------------------------------------------------
   5. THE AUTO-SCHEDULER
   Reads: campaigns + mandays + who is available.
   Writes: nothing. It recalculates every time, so the schedule can
   never drift out of step with the numbers you entered.

   Capacity is counted in HALF-DAYS, so 0.5 mandays is expressible.
   A day agent has 2 half-days (morning, afternoon).
   --------------------------------------------------------------- */
function bandForRegion(region){
  if(region==='NA') return 'night';
  if(region==='EU') return 'evening';
  return 'day';           // AU, SEA, APAC, PH, MEA
}

/* Time maths. Minutes from midnight; values over 1440 mean the next day,
   which is how the EU and NA shifts stay on the right shift date. */
const overlaps=(a,b)=>a.start<b.end&&b.start<a.end;

// Earliest free stretch of `durMin` for this agent inside `win`.
// `restrict` pins it to the first or second half of the window (half-day agents).
function findSlot(busy, win, durMin, restrict){
  let lo=win[0], hi=win[1];
  const mid=roundHalfHour(win[0]+(win[1]-win[0])/2);
  if(restrict==='am') hi=Math.min(hi,mid);
  if(restrict==='pm') lo=Math.max(lo,mid);
  for(let st=lo; st+durMin<=hi; st+=30){
    const cand={start:st,end:st+durMin};
    if(!busy.some(b=>overlaps(cand,b))) return cand;
  }
  return null;
}

const _schedCache={};
function buildSchedule(dateStr){
  if(_schedCache[dateStr]) return _schedCache[dateStr];

  // A locked day is served exactly as it was recorded — never recalculated.
  const frozen=lockedDay(dateStr);
  if(frozen){
    const asg=frozen.assignments||{};
    Object.values(asg).forEach(a=>{ if(!a.segments) a.segments=[]; });
    const out={assignments:asg, gaps:frozen.gaps||[], dateStr, locked:true};
    _schedCache[dateStr]=out; return out;
  }

  const data=D();
  const agents=data.agents.filter(a=>a.active!==false);
  const capMin={}, exc={}, restrict={}, note={}, busy={}, placed={};

  agents.forEach(a=>{
    const e=exceptionFor(a.id,dateStr);
    exc[a.id]=null; restrict[a.id]=null; note[a.id]=null;
    capMin[a.id]=WORK_MIN; busy[a.id]=[]; placed[a.id]=[];
    if(!e) return;
    if(e==='HALF_AM'||e==='HALF_DAY'){ capMin[a.id]=WORK_MIN/2; restrict[a.id]='am'; note[a.id]='HALF_AM'; }
    else if(e==='HALF_PM'){ capMin[a.id]=WORK_MIN/2; restrict[a.id]='pm'; note[a.id]='HALF_PM'; }
    else { exc[a.id]=e; capMin[a.id]=0; }   // LEAVE, FORCED_LEAVE, AWOL, OFF, TRAINING, HOLIDAY
  });

  // Put one stint on an agent's day. Returns the minutes credited, or 0.
  // `want` is the time the stint occupies; `charge` is the work it counts as.
  // A full shift window spans a lunch break, so it occupies 9h30 but counts as 8h.
  function place(aid, c, durMin, manual, maxCharge){
    if(capMin[aid]<=0) return 0;
    const win=REGION_WINDOW[c.region], winLen=win[1]-win[0];
    let want=Math.min(durMin, winLen);
    let charge = want>=winLen ? Math.min(WORK_MIN, winLen) : want;
    if(maxCharge && charge>maxCharge){ charge=Math.max(60,Math.round(maxCharge/30)*30); want=Math.min(want,charge); }
    if(charge>capMin[aid]){ charge=capMin[aid]; want=Math.min(want,charge); }
    if(charge<=0) return 0;
    const slot=findSlot(busy[aid], win, want, restrict[aid]);
    if(!slot) return 0;
    busy[aid].push(slot);
    placed[aid].push({start:slot.start, end:slot.end, campaignId:c.id, tl:c.tl,
                      fte:charge/WORK_MIN, manual:!!manual});
    capMin[aid]-=charge;
    return charge;
  }

  // --- 1. manual pins first; the auto-assigner works around them -----------
  const pins=data.overrides||{};
  const pinnedMin={};
  agents.forEach(a=>{
    const ov=pins[a.id+'|'+dateStr];
    if(!ov||capMin[a.id]<=0) return;
    (normaliseOverride(ov)||[]).forEach(seg=>{
      const c=campaign(seg.campaignId); if(!c) return;
      const win=REGION_WINDOW[c.region];
      const st=(seg.start==null)?win[0]:seg.start;
      const dur=seg.mins||(win[1]-win[0]);
      const cand={start:st,end:st+dur};
      if(busy[a.id].some(b=>overlaps(cand,b))) return;        // ignore a clash
      const credit=Math.min(dur,capMin[a.id]);
      busy[a.id].push(cand);
      placed[a.id].push({start:cand.start,end:cand.end,campaignId:c.id,tl:c.tl,
                         fte:credit/WORK_MIN, manual:true});
      capMin[a.id]-=credit;
      pinnedMin[c.id]=(pinnedMin[c.id]||0)+credit;
    });
  });

  // --- 2. auto-fill the rest ----------------------------------------------
  const demand = data.campaigns
    .filter(c=>c.status!=='Paused'&&c.status!=='Completed'&&c.status!=='Upcoming')
    .map(c=>{
      const asked=Math.round(requiredFor(c.id,dateStr)*WORK_MIN);
      return {c, asked, need:Math.max(0, asked-(pinnedMin[c.id]||0))};
    })
    .filter(x=>x.need>0)
    .sort((x,y)=> y.need-x.need || x.c.id.localeCompare(y.c.id));

  const gaps=[];
  demand.forEach(({c,need})=>{
    const want=bandForRegion(c.region);
    const win=REGION_WINDOW[c.region];
    const blk=blockMinutes(c.block||'full');
    let left=need;

    // several passes: a 1-hour block campaign may take many agents
    for(let pass=0; pass<8 && left>0; pass++){
      const eligible=agents
        .filter(a=>capMin[a.id]>0 && a.band===want)      // band is a hard rule for auto-assignment
        .sort((x,y)=>{
          const sc=a=>(a.skill===c.type?0:10)+(placed[a.id].length?3:0)+(capMin[a.id]<WORK_MIN?1:0);
          return sc(x)-sc(y)||x.id.localeCompare(y.id);
        });
      if(!eligible.length) break;
      let movedThisPass=0;
      for(const a of eligible){
        if(left<=0) break;
        const dur = blk===null ? (win[1]-win[0]) : blk;
        const got=place(a.id, c, dur, false, left);
        if(got>0){ left-=got; movedThisPass+=got; }
      }
      if(!movedThisPass) break;
    }

    if(left>0){
      const inBand=agents.filter(a=>a.band===want);
      const free=inBand.filter(a=>capMin[a.id]>0);
      gaps.push({campaignId:c.id, unfilled:left/WORK_MIN,
        reason: inBand.length===0
          ? 'No agent is on the '+want+' shift band this campaign needs.'
          : free.length===0
            ? 'All '+inBand.length+' '+want+'-band agents are fully booked (leave, half days and manual assignments included).'
            : 'The '+free.length+' agents still free have no gap long enough inside this campaign\u2019s '
              +hhmm(win[0])+'\u2013'+hhmm(win[1])+' window.'});
    }
  });

  // --- 3. tidy up into segments -------------------------------------------
  const assignments={};
  agents.forEach(a=>{
    if(exc[a.id]){ assignments[a.id]={exception:exc[a.id], segments:[], note:null}; return; }
    const segs=placed[a.id].slice().sort((x,y)=>x.start-y.start);
    // merge touching stints on the same campaign so the day reads cleanly
    const merged=[];
    segs.forEach(sg=>{
      const last=merged[merged.length-1];
      if(last && last.campaignId===sg.campaignId && last.end===sg.start){
        last.end=sg.end; last.fte+=sg.fte; last.manual=last.manual||sg.manual;
      } else merged.push(Object.assign({},sg));
    });
    assignments[a.id]={exception:null, segments:merged, note:note[a.id],
                       idle:!merged.length, freeMin:capMin[a.id]};
  });

  const out={assignments, gaps, dateStr};
  _schedCache[dateStr]=out;
  return out;
}

// Overrides used to be {am,pm}. Accept both shapes.
function normaliseOverride(ov){
  if(!ov) return null;
  if(Array.isArray(ov.segments)) return ov.segments;
  const out=[];
  const half=cid=>{ const c=campaign(cid); if(!c) return null;
    const w=REGION_WINDOW[c.region]; return {w, mid:roundHalfHour(w[0]+(w[1]-w[0])/2)}; };
  if(ov.am&&ov.pm&&ov.am===ov.pm){ const h=half(ov.am); if(h) out.push({campaignId:ov.am,start:h.w[0],mins:h.w[1]-h.w[0]}); return out; }
  if(ov.am){ const h=half(ov.am); if(h) out.push({campaignId:ov.am,start:h.w[0],mins:h.mid-h.w[0]}); }
  if(ov.pm){ const h=half(ov.pm); if(h) out.push({campaignId:ov.pm,start:h.mid+60,mins:h.w[1]-h.mid-60}); }
  return out;
}

function clearSchedCache(){ for(const k in _schedCache) delete _schedCache[k]; _snap=null; }

/* ---------------------------------------------------------------
   5b. LOCKING A DAY
   Freezes that date's allocation, plus the mandays, campaigns and
   roster behind it, so the record stops moving when you change
   anything afterwards.
   --------------------------------------------------------------- */
function lockDay(ds, quiet){
  const s=buildSchedule(ds);
  // Keep the snapshot small: only what a record needs to be read back later.
  const required={}, campaigns={}, roster={};
  D().campaigns.forEach(c=>{
    const need=requiredFor(c.id,ds);
    if(need>0) required[c.id]=need;
    campaigns[c.id]={id:c.id,name:c.name,client:c.client,type:c.type,region:c.region,tl:c.tl};
  });
  D().agents.forEach(a=>{ roster[a.id]={id:a.id,name:a.name,unit:a.unit,cls:a.cls,band:a.band,skill:a.skill}; });
  const payload={
    lockedAt:new Date().toISOString(),
    lockedBy:(DB.session&&DB.session.name)||'admin',
    assignments:(function(){
      const copy=JSON.parse(JSON.stringify(s.assignments));
      Object.values(copy).forEach(a=>{
        delete a.freeMin; delete a.idle;
        (a.segments||[]).forEach(sg=>{
          const c=campaign(sg.campaignId);
          if(c){ sg.cname=c.name; sg.cclient=c.client; sg.ctype=c.type; sg.cregion=c.region; }
          if(!sg.manual) delete sg.manual;
        });
        if(!a.segments||!a.segments.length) delete a.segments;
        if(!a.note) delete a.note;
        if(!a.exception) delete a.exception;
      });
      return copy;
    })(),
    gaps:JSON.parse(JSON.stringify(s.gaps||[])),
    required, campaigns, roster};
  editData(d=>{ d.history=d.history||{}; d.history[ds]=payload; });
  clearSchedCache();
  if(!quiet) render();
}
function unlockDay(ds){ editData(d=>{ if(d.history) delete d.history[ds]; }); clearSchedCache(); render(); }

/* Settings that live in the data file, so they publish with everything else. */
function appSettings(){
  return Object.assign({autoLock:true, autoLockAfterDays:1, autoLockWindowDays:14}, D().settings||{});
}
function setSetting(k,v){ touched(d=>{ d.settings=d.settings||{}; d.settings[k]=v; }); }

/* Auto-lock. There is no server here, so "automatic" means it runs when an
   admin opens the app — not overnight on its own. It only locks days that
   actually had an allocation, and the result is an unpublished change like
   any other until you publish it. */
let _autoLockRan=false, autoLockMsg=null;
function runAutoLock(){
  if(_autoLockRan) return 0;
  _autoLockRan=true;
  if(!DB.session || DB.session.role!=='admin') return 0;
  const st=appSettings();
  if(!st.autoLock) return 0;
  const today=parseYmd(todayStr());
  const done=[];
  for(let i=Math.max(1,st.autoLockAfterDays); i<=st.autoLockWindowDays; i++){
    const d=addDays(today,-i);
    if(isWeekend(d)) continue;
    const ds=ymd(d);
    if(lockedDay(ds)) continue;
    if(daySummary(ds).mandays<=0) continue;      // nothing was allocated, nothing to record
    lockDay(ds,true);
    done.push(ds);
  }
  if(done.length){
    clearSchedCache();
    autoLockMsg=done.length+' past day'+(done.length===1?'':'s')+' locked automatically ('
      +done.slice(0,4).join(', ')+(done.length>4?' and '+(done.length-4)+' more':'')
      +'). Publish to share the record with everyone else.';
  }
  return done.length;
}

function historySizeKB(){
  try{ return Math.round(JSON.stringify(D().history||{}).length/1024); }catch(e){ return 0; }
}
function pruneHistory(days){
  const cut=ymd(addDays(new Date(),-days));
  const gone=Object.keys(D().history||{}).filter(k=>k<cut);
  if(!gone.length){ alert('Nothing is older than '+days+' days.'); return; }
  if(!confirm('Permanently remove '+gone.length+' locked day'+(gone.length===1?'':'s')+' older than '+days+' days? Export them first if you need them.')) return;
  touched(d=>{ gone.forEach(k=>delete d.history[k]); });
}

function daySummary(ds){
  const s=buildSchedule(ds);
  let mandays=0, people=0, exceptions=0;
  Object.values(s.assignments).forEach(a=>{
    const m=(a.segments||[]).reduce((n,x)=>n+x.fte,0);
    if(m>0){ mandays+=m; people++; }
    if(a.exception) exceptions++;
  });
  return {mandays, people, exceptions, unfilled:(s.gaps||[]).reduce((n,g)=>n+g.unfilled,0), locked:!!s.locked};
}

function scheduleFor(aid, dateStr){
  const s=buildSchedule(dateStr).assignments[aid];
  return s || {exception:null, segments:[], idle:true};
}
function scheduleText(s){
  if(s.exception) return EXC_LABEL[s.exception]||s.exception;
  if(!s.segments.length) return 'Unassigned';
  return s.segments.map(x=>hhmm(x.start)+' to '+hhmm(x.end)+' '+cinfo(x).name+' | TL: '+x.tl).join('  ');
}

/* ---------------------------------------------------------------
   6. CLOCK EVENTS AND STATUS
   --------------------------------------------------------------- */
const nowMin=(d=new Date())=>d.getHours()*60+d.getMinutes();
const todayStr=()=>ymd(new Date());
// A shift starting at/after 6 PM belongs to the date it STARTED on.
const shiftDateFor=(d=new Date())=> nowMin(d)<6*60 ? ymd(addDays(d,-1)) : ymd(d);

function rnd(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0)%100000)/100000}

const eventsFor=(aid,ds)=>DB.events.filter(e=>e.agentId===aid&&e.shiftDate===ds).sort((a,b)=>a.t-b.t);
function addEvent(aid,type,ds){
  DB.events.push({agentId:aid,type,t:Date.now(),shiftDate:ds,src:'web',ua:navigator.userAgent.slice(0,120)});
  save();
}
function clockState(aid,ds){
  const ev=eventsFor(aid,ds);
  let inAt=null,outAt=null,onBreak=false,breakMs=0,lastBreak=null;
  for(const e of ev){
    if(e.type==='IN'&&!inAt) inAt=e.t;
    if(e.type==='OUT') outAt=e.t;
    if(e.type==='BREAK_START'){onBreak=true;lastBreak=e.t}
    if(e.type==='BREAK_END'){onBreak=false;if(lastBreak)breakMs+=e.t-lastBreak;lastBreak=null}
  }
  if(onBreak&&lastBreak) breakMs+=Date.now()-lastBreak;
  return {inAt,outAt,onBreak,breakMs};
}
function seedToday(){
  const ds=todayStr();
  if(DB.events.some(e=>e.shiftDate===ds&&e.src==='seed')) return;
  const now=nowMin();
  D().agents.forEach(a=>{
    if(a.id===DEMO_AGENT) return;
    const s=scheduleFor(a.id,ds);
    if(s.exception||!s.segments.length) return;
    const start=s.segments[0].start;
    if(now<start) return;
    if(rnd(a.id+ds+'noshow')>0.88) return;
    const lateBy = rnd(a.id+ds+'lateroll')>0.75 ? Math.round(9+rnd(a.id+ds+'lmin')*45) : -Math.round(rnd(a.id+ds+'early')*12);
    const t=new Date(); t.setHours(0,start+lateBy,0,0);
    if(t.getTime()>Date.now()) return;
    DB.events.push({agentId:a.id,type:'IN',t:t.getTime(),shiftDate:ds,src:'seed'});
  });
  save();
}

const STATUS={
  IN:{label:'Clocked In',cls:'p-ok',color:'var(--ok)'},
  LATE:{label:'Late',cls:'p-warn',color:'var(--warn)'},
  MIA:{label:'MIA',cls:'p-bad',color:'var(--bad)'},
  ABSENT:{label:'Absent',cls:'p-bad',color:'var(--bad)'},
  LEAVE:{label:'On Leave',cls:'p-info',color:'var(--info)'},
  FORCED_LEAVE:{label:'Forced Leave',cls:'p-info',color:'var(--info)'},
  AWOL:{label:'AWOL',cls:'p-bad',color:'var(--bad)'},
  OFF:{label:'Rest Day',cls:'p-mute',color:'var(--mute)'},
  TRAINING:{label:'Training',cls:'p-accent',color:'var(--accent)'},
  HOLIDAY:{label:'Holiday',cls:'p-info',color:'var(--info)'},
  PENDING:{label:'Not Yet Due',cls:'p-mute',color:'var(--mute)'},
  BREAK:{label:'On Break',cls:'p-accent',color:'var(--accent)'},
  DONE:{label:'Clocked Out',cls:'p-mute',color:'var(--text-3)'},
  UNASSIGNED:{label:'Spare',cls:'p-mute',color:'var(--mute)'},
};
function resolveStatus(aid,ds){
  const sched=scheduleFor(aid,ds);
  if(sched.exception){
    const k=sched.exception;
    return {key:STATUS[k]?k:'LEAVE', sched, lateMin:0, cs:clockState(aid,ds)};
  }
  if(!sched.segments.length) return {key:'UNASSIGNED', sched, lateMin:0, cs:clockState(aid,ds)};
  const cs=clockState(aid,ds), start=sched.segments[0].start, since=nowMin()-start;
  if(cs.inAt){
    const d=new Date(cs.inAt);
    const lateMin=Math.max(0,(d.getHours()*60+d.getMinutes())-start-SETTINGS.grace);
    if(cs.outAt) return {key:'DONE',sched,lateMin,cs};
    if(cs.onBreak) return {key:'BREAK',sched,lateMin,cs};
    return {key:lateMin>0?'LATE':'IN',sched,lateMin,cs};
  }
  if(since<0) return {key:'PENDING',sched,lateMin:0,cs};
  if(since>=SETTINGS.absent) return {key:'ABSENT',sched,lateMin:0,cs};
  if(since>=SETTINGS.mia) return {key:'MIA',sched,lateMin:0,cs};
  return {key:'LATE',sched,lateMin:Math.max(0,since-SETTINGS.grace),cs};
}

/* ---------------------------------------------------------------
   7. COVERAGE
   --------------------------------------------------------------- */
function inWindowNow(start,end,now){
  if(end<=1440) return now>=start&&now<=end;
  return now>=start||now<=(end-1440);
}
function coverage(ds){
  const now=nowMin(), sched=buildSchedule(ds);
  return D().campaigns.map(c=>{
    const w=REGION_WINDOW[c.region];
    const row={c, required:requiredFor(c.id,ds), scheduled:0, actual:0, agents:[],
               window:w, live:inWindowNow(w[0],w[1],now),
               gap:(sched.gaps.find(g=>g.campaignId===c.id)||null)};
    D().agents.forEach(a=>{
      const st=resolveStatus(a.id,ds);
      if(st.sched.exception) return;
      st.sched.segments.forEach(seg=>{
        if(seg.campaignId!==c.id) return;
        row.scheduled+=seg.fte;
        const working=['IN','LATE','BREAK'].includes(st.key);
        const counts=working&&inWindowNow(seg.start,seg.end,now);
        if(counts) row.actual+=seg.fte;
        row.agents.push({a,seg,st,counts});
      });
    });
    row.balance=row.actual-row.required;
    return row;
  });
}

function download(filename, text, mime){
  const url=URL.createObjectURL(new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'}));
  const a=el('a',{href:url,download:filename}); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadCSV(filename,rows){
  const csv=rows.map(r=>r.map(v=>{const s=v==null?'':String(v);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  download(filename,'﻿'+csv,'text/csv');
}
function exportRegister(ds){
  const rows=[['Date','Agent','Unit','Class','Scheduled','Campaign(s)','TL(s)','Clock In','Clock Out','Late (min)','Worked','Status']];
  D().agents.forEach(a=>{
    const st=resolveStatus(a.id,ds), cs=st.cs||{};
    const segs=st.sched.segments||[];
    const worked=cs.inAt?Math.round(((cs.outAt||Date.now())-cs.inAt-(cs.breakMs||0))/60000):0;
    rows.push([ds,a.name,a.unit,a.cls,scheduleText(st.sched),
      segs.map(s=>cinfo(s).name).join(' / '),
      [...new Set(segs.map(s=>s.tl))].join(' / '),
      cs.inAt?new Date(cs.inAt).toLocaleTimeString():'',
      cs.outAt?new Date(cs.outAt).toLocaleTimeString():'',
      st.lateMin||0, cs.inAt?fmtDur(worked):'', STATUS[st.key].label]);
  });
  downloadCSV('attendance-register-'+ds+'.csv',rows);
}
function exportCoverage(ds){
  const rows=[['Date','Client','Campaign','Type','Region','TL','Shift Window','Mandays Required','Scheduled','Actual Now','Balance','Unfilled','Reason']];
  coverage(ds).forEach(r=>rows.push([ds,r.c.client,r.c.name,r.c.type,r.c.region,r.c.tl,
    hhmm(r.window[0])+' to '+hhmm(r.window[1]),r.required,fteTxt(r.scheduled),fteTxt(r.actual),
    fteTxt(r.balance), r.gap?fteTxt(r.gap.unfilled):'0', r.gap?r.gap.reason:'']));
  downloadCSV('coverage-'+ds+'.csv',rows);
}
function exportSchedule(ds){
  const rows=[['Date','Agent','Unit','Status','Segment 1','Campaign 1','TL 1','Segment 2','Campaign 2','TL 2']];
  rosterFor(ds).forEach(a=>{
    const s=scheduleFor(a.id,ds), g=s.segments||[];
    rows.push([ds,a.name,a.unit, s.exception?STATUS[s.exception].label:(g.length?'Scheduled':'Spare'),
      g[0]?hhmm(g[0].start)+'-'+hhmm(g[0].end):'', g[0]?cinfo(g[0]).name:'', g[0]?g[0].tl:'',
      g[1]?hhmm(g[1].start)+'-'+hhmm(g[1].end):'', g[1]?cinfo(g[1]).name:'', g[1]?g[1].tl:'']);
  });
  downloadCSV('schedule-'+ds+'.csv',rows);
}

  const ds=shiftDateFor();
  const rows=coverage(ds).sort((a,b)=>(b.live-a.live)||(a.balance-b.balance));
  const w=el('div',{});
  w.appendChild(el('div',{class:'page-head'},
    el('div',{}, el('h1',{},'Coverage vs requirement'),
      el('p',{class:'sub'},'Mandays required against who is actually clocked in, right now')),
    el('div',{class:'spacer'}),
    el('button',{class:'btn btn-sm',onclick:()=>exportCoverage(ds)},'Export coverage (CSV)')));

  const liveRows=rows.filter(r=>r.live);
  const tot=liveRows.reduce((o,r)=>({req:o.req+r.required,act:o.act+r.actual,sch:o.sch+r.scheduled}),{req:0,act:0,sch:0});
  const bal=tot.act-tot.req, dayTot=rows.reduce((n,r)=>n+r.required,0);
  const byUnit={}; liveRows.forEach(r=>{const k=r.c.client;byUnit[k]=byUnit[k]||{req:0,act:0};byUnit[k].req+=r.required;byUnit[k].act+=r.actual});

  w.appendChild(el('div',{class:'rollups'},
    el('div',{class:'roll'},el('div',{class:'k'},'Required now'),el('div',{class:'v'},fteTxt(tot.req)),
      el('div',{class:'tiny'},fteTxt(dayTot)+' across the full day')),
    el('div',{class:'roll'},el('div',{class:'k'},'Scheduled'),el('div',{class:'v'},fteTxt(tot.sch))),
    el('div',{class:'roll'},el('div',{class:'k'},'Available now'),el('div',{class:'v'},fteTxt(tot.act))),
    el('div',{class:'roll'},el('div',{class:'k'},'Balance'),
      el('div',{class:'v bal '+(bal<0?'neg':bal>0?'pos':'zero')},(bal>0?'+':'')+fteTxt(bal)),
      el('div',{class:'tiny'}, bal<0?'short by '+fteTxt(-bal):bal>0?'over by '+fteTxt(bal):'exactly met')),
    ...Object.entries(byUnit).map(([k,v])=>el('div',{class:'roll'},el('div',{class:'k'},k+' balance'),
      el('div',{class:'v bal '+((v.act-v.req)<0?'neg':(v.act-v.req)>0?'pos':'zero')},((v.act-v.req)>0?'+':'')+fteTxt(v.act-v.req))))));

  const tb=el('tbody',{});
  rows.forEach(r=>{
    const pct=Math.min(1,r.required?r.actual/r.required:1);
    const cls=!r.live?'ok':r.balance<0?(pct<0.5?'bad':'warn'):r.balance>0?'over':'ok';
    const dots=el('div',{class:'dots'});
    r.agents.slice(0,14).forEach(({a,st,counts})=>dots.appendChild(el('span',{class:'dot',
      title:a.name+' — '+STATUS[st.key].label,
      style:'background:'+(counts?STATUS[st.key].color:'transparent')+';border-color:'+STATUS[st.key].color})));
    if(!r.agents.length) dots.appendChild(el('span',{class:'tiny'},'nobody assigned'));
    tb.appendChild(el('tr',{},
      el('td',{}, el('div',{class:'name'},r.c.name),
        el('div',{class:'tiny'},r.c.client+' · '+r.c.type+' · TL: '+r.c.tl)),
      el('td',{class:'tiny'}, hhmm(r.window[0])+'–'+hhmm(r.window[1]),
        !r.live&&el('div',{},el('span',{class:'pill p-mute',style:'margin-top:3px'},'Not yet due'))),
      el('td',{class:'r'}, fteTxt(r.required)),
      el('td',{class:'r muted'}, fteTxt(r.scheduled),
        r.gap?el('div',{class:'tiny',style:'color:var(--bad)'},fteTxt(r.gap.unfilled)+' unfilled'):null),
      el('td',{class:'r',style:'font-weight:650'}, r.live?fteTxt(r.actual):'—'),
      el('td',{class:'r'}, r.live?el('span',{class:'bal '+(r.balance<0?'neg':r.balance>0?'pos':'zero')},
        (r.balance>0?'+':'')+fteTxt(r.balance)):el('span',{class:'tiny'},'—')),
      el('td',{style:'min-width:110px'}, el('div',{class:'bar'},el('i',{class:cls,style:'width:'+(r.live?pct*100:0)+'%'})),
        el('div',{class:'tiny',style:'margin-top:3px'}, !r.live?'window closed':r.required?Math.round(r.actual/r.required*100)+'% covered':'no demand')),
      el('td',{}, dots)));
  });
  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'card-head'},el('h2',{},'By campaign'),el('span',{class:'tiny'},'Worst shortfall first')));
  card.appendChild(el('div',{class:'tablewrap'},el('table',{},el('thead',{},el('tr',{},
    [['Campaign',''],['Window',''],['Required','r'],['Scheduled','r'],['Actual','r'],['Balance','r'],['Coverage',''],['Who','']]
      .map(([h,c])=>el('th',{class:c},h)))),tb)));
  w.appendChild(card);

  const gaps=buildSchedule(ds).gaps;
  if(gaps.length){
    const gc=el('div',{class:'card',style:'margin-top:16px'});
    gc.appendChild(el('div',{class:'card-head'},el('h2',{},'Why some mandays could not be filled'),
      el('span',{class:'pill p-warn'},fteTxt(gaps.reduce((n,g)=>n+g.unfilled,0))+' mandays short')));
    gaps.forEach(g=>gc.appendChild(el('div',{class:'exc'},
      el('span',{class:'pill p-warn'},fteTxt(g.unfilled)),
      el('div',{class:'grow'}, el('div',{class:'name'},campaign(g.campaignId).name),
        el('div',{class:'tiny'},g.reason)))));
    w.appendChild(gc);
  }
  return w;
}

/* ---------------------------------------------------------------
   9b. MANUAL RE-ASSIGNMENT
   A pin overrules the auto-assigner for one agent on one date.
   Stored as overrides['agentId|date'] = {am:campaignId, pm:campaignId}
   Leave a half blank and the system still fills that half itself.
   --------------------------------------------------------------- */
function hasOverride(aid,ds){
  const o=(D().overrides||{})[aid+'|'+ds];
  if(!o) return false;
  if(Array.isArray(o.segments)) return o.segments.length>0;
  return !!(o.am||o.pm);
}
function getOverride(aid,ds){ return (D().overrides||{})[aid+'|'+ds]||{}; }

function closeModal(){ const m=document.querySelector('.modalbg'); if(m) m.remove(); }
function showModal(title, bodyNode, actions){
  closeModal();
  const bg=el('div',{class:'modalbg',onclick:e=>{if(e.target===bg)closeModal()}});
  const card=el('div',{class:'modal'},
    el('div',{class:'card-head'}, el('h2',{},title), el('div',{class:'spacer'}),
      el('button',{class:'iconbtn','aria-label':'Close',onclick:closeModal},'×')),
    el('div',{class:'card-body'}, bodyNode),
    el('div',{class:'card-body',style:'display:flex;gap:9px;flex-wrap:wrap;border-top:1px solid var(--border)'}, actions));
  bg.appendChild(card); document.body.appendChild(bg);
  document.addEventListener('keydown', function esc(e){
    if(e.key==='Escape'){ closeModal(); document.removeEventListener('keydown',esc); }});
}

function openReassign(aid, ds){
  const a=agent(aid), sched=scheduleFor(aid,ds);
  const live=D().campaigns.filter(c=>c.status!=='Completed').sort((x,y)=>x.name.localeCompare(y.name));
  if(!live.length){ showModal('Reassign',el('p',{class:'sub'},'There are no campaigns to assign to yet.'),
    [el('button',{class:'btn',onclick:closeModal},'Close')]); return; }

  // start from whatever is already pinned, else from what the system worked out
  const existing = normaliseOverride(getOverride(aid,ds));
  let rows = (existing && existing.length ? existing
              : (sched.segments||[]).map(x=>({campaignId:x.campaignId,start:x.start,mins:x.end-x.start})))
             .map(r=>Object.assign({},r));

  const list=el('div',{});
  const total=el('div',{class:'tiny',style:'margin-top:8px'});
  const warn=el('div',{class:'banner warn hide',style:'margin-top:12px'});

  function redraw(){
    list.innerHTML='';
    rows.forEach((r,i)=>list.appendChild(rowEditor(r,i)));
    if(!rows.length) list.appendChild(el('p',{class:'tiny',style:'padding:8px 0'},
      'No stints. Save like this and the system assigns this agent automatically again.'));
    const mins=rows.reduce((n,r)=>n+(r.mins||0),0);
    const over=mins>WORK_MIN;
    total.innerHTML='';
    total.append('Total on shift: '+fmtDur(mins)+'  ·  '+fteTxt(Math.min(mins,WORK_MIN)/WORK_MIN)+' mandays');
    total.style.color = over?'var(--warn)':'var(--text-3)';
    if(over) total.append(' — over a full '+WORK_HOURS+'-hour day, only the first '+WORK_HOURS+'h count as mandays');
    checkWarnings();
  }

  function checkWarnings(){
    const msgs=[];
    const bad=rows.map(r=>campaign(r.campaignId)).filter(c=>c&&bandForRegion(c.region)!==a.band);
    if(bad.length) msgs.push(bad.map(c=>c.name).join(' and ')+' runs on the '+bandForRegion(bad[0].region)
      +' shift band, but '+a.name.split(' ')[0]+' is a '+a.band+'-band agent.');
    const sorted=rows.slice().sort((x,y)=>x.start-y.start);
    for(let i=1;i<sorted.length;i++)
      if(sorted[i].start < sorted[i-1].start+sorted[i-1].mins){ msgs.push('Two stints overlap — the later one will be dropped.'); break; }
    rows.forEach(r=>{ const c=campaign(r.campaignId); if(!c) return;
      const w=REGION_WINDOW[c.region];
      if(r.start<w[0]||r.start+r.mins>w[1])
        msgs.push(c.name+' runs '+hhmm(w[0])+'–'+hhmm(w[1])+'; this stint falls outside that window.'); });
    if(msgs.length){ warn.textContent=msgs.join('  '); warn.classList.remove('hide'); }
    else warn.classList.add('hide');
  }

  function rowEditor(r,i){
    const camp=el('select',{class:'input',style:'flex:2;min-width:150px'},
      live.map(c=>el('option',{value:c.id,selected:c.id===r.campaignId?'':null},c.name)));
    const startSel=el('select',{class:'input',style:'flex:1;min-width:110px'});
    const durSel=el('select',{class:'input',style:'flex:1;min-width:110px'});

    function fillTimes(){
      const c=campaign(camp.value)||live[0];
      const w=REGION_WINDOW[c.region];
      startSel.innerHTML='';
      for(let t=w[0]; t<w[1]; t+=30)
        startSel.appendChild(el('option',{value:String(t),selected:t===r.start?'':null},hhmm(t)));
      if(![...startSel.options].some(o=>o.selected)) startSel.value=String(w[0]);
      durSel.innerHTML='';
      durSel.appendChild(el('option',{value:'full',selected:r.mins===(w[1]-w[0])?'':null},
        'Full shift ('+fmtDur(w[1]-w[0])+')'));
      [1,2,3,4,5,6,7,8].forEach(h=>durSel.appendChild(
        el('option',{value:String(h*60),selected:r.mins===h*60?'':null}, h+(h===1?' hour':' hours'))));
      if(![...durSel.options].some(o=>o.selected)) durSel.value='full';
    }
    function commit(){
      const c=campaign(camp.value)||live[0];
      const w=REGION_WINDOW[c.region];
      r.campaignId=c.id;
      r.start=Number(startSel.value);
      r.mins = durSel.value==='full' ? (w[1]-w[0]) : Number(durSel.value);
      redraw();
    }
    camp.addEventListener('change',()=>{ r.campaignId=camp.value; r.start=REGION_WINDOW[campaign(camp.value).region][0];
      fillTimes(); commit(); });
    startSel.addEventListener('change',commit);
    durSel.addEventListener('change',commit);
    fillTimes();

    return el('div',{style:'display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap'},
      camp, startSel, durSel,
      el('button',{class:'iconbtn','aria-label':'Remove stint',title:'Remove',
        onclick:()=>{rows.splice(i,1);redraw()}},'×'));
  }

  function quick(kind){
    const c=campaign(rows[0]&&rows[0].campaignId)||live[0];
    const w=REGION_WINDOW[c.region], mid=roundHalfHour(w[0]+(w[1]-w[0])/2);
    if(kind==='full') rows=[{campaignId:c.id,start:w[0],mins:w[1]-w[0]}];
    if(kind==='am')   rows=[{campaignId:c.id,start:w[0],mins:mid-w[0]}];
    if(kind==='pm')   rows=[{campaignId:c.id,start:mid,mins:w[1]-mid}];
    redraw();
  }

  const body=el('div',{},
    el('p',{class:'sub',style:'margin-bottom:12px'},
      a.name+' · '+parseYmd(ds).toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})
      +' · '+a.band+' band'),
    el('div',{class:'card',style:'background:var(--bg-sunk);margin-bottom:14px'},
      el('div',{class:'card-body',style:'padding:11px 13px'},
        el('div',{class:'tiny',style:'margin-bottom:4px'},'Right now'),
        el('div',{style:'font-size:13.5px'}, sched.exception?STATUS[sched.exception].label:scheduleText(sched)),
        timeline(sched.segments||[]))),
    el('div',{style:'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px'},
      el('button',{class:'btn btn-sm',onclick:()=>quick('full')},'Whole shift'),
      el('button',{class:'btn btn-sm',onclick:()=>quick('am')},'Morning half'),
      el('button',{class:'btn btn-sm',onclick:()=>quick('pm')},'Afternoon half')),
    list,
    el('button',{class:'btn btn-sm',onclick:()=>{
      const c=live[0], w=REGION_WINDOW[c.region];
      const lastEnd=rows.length?Math.max(...rows.map(r=>r.start+r.mins)):w[0];
      rows.push({campaignId:c.id,start:Math.max(w[0],Math.min(lastEnd,w[1]-60)),mins:120}); redraw();
    }},'+ Add a stint'),
    total, warn);
  redraw();

  const actions=[
    el('button',{class:'btn btn-primary',onclick:()=>{
      touched(d=>{
        d.overrides=d.overrides||{};
        const clean=rows.filter(r=>r.campaignId&&r.mins>0)
          .map(r=>({campaignId:r.campaignId,start:r.start,mins:r.mins}));
        if(clean.length) d.overrides[aid+'|'+ds]={segments:clean};
        else delete d.overrides[aid+'|'+ds];
      });
      closeModal();
    }},'Save assignment'),
    hasOverride(aid,ds)&&el('button',{class:'btn btn-danger',onclick:()=>{
      touched(d=>{ if(d.overrides) delete d.overrides[aid+'|'+ds]; }); closeModal();
    }},'Back to automatic'),
    el('button',{class:'btn',onclick:closeModal},'Cancel')
  ].filter(Boolean);

  showModal('Reassign '+a.name.split(' ')[0], body, actions);
}

/* A day drawn as a bar, 6 AM through 6 AM. Makes split and part-day
   assignments readable at a glance. */
const TL_START=6*60, TL_END=30*60;
function timeline(segments, compact){
  const bar=el('div',{class:'tl'+(compact?' tl-sm':'')});
  (segments||[]).forEach(s=>{
    const a=Math.max(TL_START,s.start), b=Math.min(TL_END,s.end);
    if(b<=a) return;
    bar.appendChild(el('span',{class:'tlseg',
      style:'left:'+((a-TL_START)/(TL_END-TL_START)*100)+'%;width:'+((b-a)/(TL_END-TL_START)*100)
        +'%;background:'+(TL_COLOR[s.tl]||'var(--mute)'),
      title:hhmm(s.start)+'–'+hhmm(s.end)+' · '+cinfo(s).name+' · TL: '+s.tl}));
  });
  return bar;
}
function timelineAxis(){
  const ax=el('div',{class:'tlaxis'});
  for(let t=TL_START;t<=TL_END;t+=360)
    ax.appendChild(el('span',{style:'left:'+((t-TL_START)/(TL_END-TL_START)*100)+'%'},hhmm(t)));
  return ax;
}

      closeModal();
    }},'Save'),
    el('button',{class:'btn',onclick:closeModal},'Cancel')]);
}

function touched(fn){ editData(fn); clearSchedCache(); render(); }

function workingDays(from, n){
  const out=[]; let d=parseYmd(from);
  while(out.length<n){ if(!isWeekend(d)) out.push(ymd(d)); d=addDays(d,1); }
  return out;
}
// Mandays available on a date, by shift band. A half day counts as 0.5.
function capacityOn(ds){
  const by={day:0,evening:0,night:0};
  D().agents.forEach(a=>{
    if(a.active===false) return;
    const e=exceptionFor(a.id,ds);
    let v=1;
    if(e==='HALF_AM'||e==='HALF_PM'||e==='HALF_DAY') v=0.5;
    else if(e) v=0;
    by[a.band]=(by[a.band]||0)+v;
  });
  return by;
}

/* --- mandays grid: the daily job --- */
function AdminMandays(){
  const days=workingDays(adminDate,gridDays);
  const camps=D().campaigns.filter(c=>c.status!=='Completed');
  const w=el('div',{});

  w.appendChild(el('div',{class:'toolbar'},
    el('button',{class:'btn btn-sm',onclick:()=>{adminDate=ymd(addDays(parseYmd(adminDate),-7));render()}},'← Earlier'),
    el('input',{class:'input',type:'date',style:'width:170px',value:adminDate,
      onchange:e=>{adminDate=e.target.value||todayStr();render()}}),
    el('button',{class:'btn btn-sm',onclick:()=>{adminDate=ymd(addDays(parseYmd(adminDate),7));render()}},'Later →'),
    el('button',{class:'btn btn-sm',onclick:()=>{adminDate=todayStr();render()}},'Today'),
    el('div',{class:'spacer'}),
    el('span',{class:'tiny'},'Grey = campaign default · Blue = changed for that day only · 1 manday = '+WORK_HOURS+'h')));

  const tb=el('tbody',{});
  camps.forEach(c=>{
    const cells=days.map(ds=>{
      if(lockedDay(ds)) return el('td',{class:'c'},
        el('span',{class:'tiny',title:'This day is locked'},fteTxt(requiredFor(c.id,ds))+' 🔒'));
      const ov=requiredIsOverride(c.id,ds);
      const inp=el('input',{class:'gridcell'+(ov?' set':' dflt'),type:'number',min:'0',step:'0.25',
        value: ov ? String(requiredFor(c.id,ds)) : '',
        placeholder:String(c.mandays||0),
        title:c.name+' — '+ds,
        onchange:e=>{
          const v=e.target.value.trim();
          touched(d=>{
            d.required=d.required||{}; d.required[c.id]=d.required[c.id]||{};
            if(v==='') delete d.required[c.id][ds]; else d.required[c.id][ds]=Number(v);
          });
        }});
      return el('td',{class:'c'},inp);
    });
    tb.appendChild(el('tr',{},
      el('td',{}, el('div',{class:'name'},c.name),
        el('div',{class:'tiny'},c.client+' · '+c.type+' · '+c.region+' · TL: '+c.tl)),

    const d=addDays(new Date(),-i);
    if(!isWeekend(d)) days.push(ymd(d));

  days.sort().reverse();

    el('span',{},lockedCount?'🔒':'●'),

function exportHistory(){
  const hist=D().history||{};
  const dates=Object.keys(hist).sort();
  if(!dates.length){ alert('No days are locked yet.'); return; }
  const rows=[['Date','Locked by','Locked at','Agent','Unit','Status','Start','End','Campaign','Client','TL','Mandays']];
  dates.forEach(ds=>{
    const h=hist[ds];
    Object.entries(h.assignments||{}).forEach(([aid,a])=>{
      const ag=(h.roster&&h.roster[aid])||agent(aid)||{name:aid,unit:''};
      if(a.exception||!segsOf(a).length){
        rows.push([ds,h.lockedBy,new Date(h.lockedAt).toLocaleString(),ag.name,ag.unit,
          a.exception?(STATUS[a.exception]||{label:a.exception}).label:'Spare','','','','','',0]);
        return;
      }
      a.segments.forEach(sg=>{
        const c=sg.cname?{name:sg.cname,client:sg.cclient||''}
                 :((h.campaigns&&h.campaigns[sg.campaignId])||campaign(sg.campaignId)||{name:sg.campaignId,client:''});
        rows.push([ds,h.lockedBy,new Date(h.lockedAt).toLocaleString(),ag.name,ag.unit,'Scheduled',
          hhmm(sg.start),hhmm(sg.end),c.name,c.client,sg.tl,fteTxt(sg.fte)]);
      });
    });
  });
  downloadCSV('allocation-history.csv',rows);
}

      }},'Download data.json'),
      el('button',{class:'btn btn-danger',onclick:()=>{
        if(confirm('Throw away every change you have made since the last publish?')){
          discardLocal(); clearSchedCache(); render();
        }}},'Discard my changes')));
  }
  card.appendChild(body);
  w.appendChild(card);

  const info=el('div',{class:'card',style:'margin-top:16px'});
  info.appendChild(el('div',{class:'card-head'},el('h2',{},'How this works')));
  info.appendChild(el('div',{class:'card-body'},
    el('p',{class:'sub',style:'margin-bottom:10px'},
      'This app has no server, so there is no live database. The campaign list, the mandays and the roster live in a file called data.json next to index.html in your repository. Everyone who opens the link reads that file.'),
    el('p',{class:'sub',style:'margin-bottom:10px'},
      'Editing here changes your own copy straight away so you can check the result. Publishing replaces the shared file.'),
    el('p',{class:'sub'},
      'Clock-ins are different: they stay in each person’s own browser and are never shared. That is the main thing a real backend would fix.')));
  w.appendChild(info);
  return w;
}

/* ---------------------------------------------------------------
   11. BOOT
   --------------------------------------------------------------- */
function boot(){
  loadLocal();
  document.documentElement.dataset.theme=DB.theme||'auto';
  render();
  // Load the published data file, if there is one.
  // Skipped when opened straight off disk (file://), where fetch is blocked.
  if(location.protocol==='http:'||location.protocol==='https:')
  fetch('data.json',{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      if(!j||!j.campaigns||!j.agents) return;
      BASE=Object.assign({required:{},exceptions:{},meta:{}}, j);
      clearSchedCache();
      if(DB.session){ seedToday(); _autoLockRan=false; runAutoLock(); }
      render();
    })
    .catch(()=>{});
  if(DB.session){ seedToday(); runAutoLock(); }
  render();
  setInterval(()=>{ if(DB.session && view!=='admin') render(); }, 30000);
}
boot();
</script>
